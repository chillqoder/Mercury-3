<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Living Glass Aquarium</title>
<style>
  :root { --ui-bg: rgba(8,14,26,.55); --ui-border: rgba(255,255,255,.16); }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#0a0f1a; font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #hud { position:fixed; top:14px; right:14px; display:flex; gap:8px; z-index:10;
    user-select:none; -webkit-user-select:none; }
  #hud button { color:#cfe3ff; background:var(--ui-bg); border:1px solid var(--ui-border);
    padding:8px 14px; border-radius:999px; font-size:13px; letter-spacing:.02em; cursor:pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background .18s, transform .1s; }
  #hud button:hover { background:rgba(24,40,70,.75); }
  #hud button:active { transform:scale(.97); }
  #hud button.paused { outline:2px solid #4aa8ff88; }
  #hint { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:9;
    color:#8fb0d8; font-size:12.5px; letter-spacing:.04em; opacity:.85; pointer-events:none;
    text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.6); white-space:nowrap; }
  #status { position:fixed; left:14px; top:14px; z-index:9; color:#6e8db4;
    font-size:11px; letter-spacing:.06em; opacity:.8; pointer-events:none; }
</style>

<body>
<div id="app"></div>

<div id="hint">drag to orbit · scroll to zoom · pause to inspect</div>
<div id="hud">
  <button id="btnPause" title="Pause / resume animation">Pause</button>
  <button id="btnReset" title="Reset camera view">Reset view</button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= UTILITIES ================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0xC0FFEE);
const rrange = (a, b) => a + rand() * (b - a);
const pick = arr => arr[(rand() * arr.length) | 0];

/* ================= WORLD CONFIG ================= */
const TANK = {
  w: 8, d: 4, h: 5,
  y0: 0, waterY: 4.55, rimY: 4.95,
  glass: 0.08,
  innerW: 8, innerD: 4,
};
const CAM_DEFAULT = { pos: new THREE.Vector3(6.8, 4.6, 6.4), target: new THREE.Vector3(0, 1.65, -0.2) };

/* ================= RENDERER / SCENE / CAMERA ================= */

let renderer, scene, camera, controls;
const container = document.getElementById('app');

function initRenderer() {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);
}

function initScene() { scene = new THREE.Scene(); }

function initCamera() {
  camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 140);
  camera.position.copy(CAM_DEFAULT.pos);
}

function initControls() {
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(CAM_DEFAULT.target);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 5.5;
  controls.maxDistance = 22;
  controls.maxPolarAngle = Math.PI * 0.485;
  controls.minPolarAngle = Math.PI * 0.16;
  controls.rotateSpeed = 0.7;
  controls.zoomSpeed = 0.9;
  controls.panSpeed = 0.6;
  controls.addEventListener('change', enforceCameraBounds);
}

/* ================= STAGE 1: TANK & ENVIRONMENT ================= */

/* ---------- shared glsl fragments ---------- */
// three.js injects viewMatrix/cameraPosition into fragment shaders but not projectionMatrix.
const FRAG_PROJ = `uniform mat4 projectionMatrix;
`;
const ENV_GLSL = `
uniform vec3 uSunDir;
uniform vec3 uSunColor;
vec3 envColor(vec3 d){
  float h = d.y * 0.5 + 0.5;
  vec3 horizon = vec3(0.10, 0.22, 0.32);
  vec3 zenith  = vec3(0.045, 0.11, 0.21);
  vec3 deep    = vec3(0.02, 0.04, 0.08);
  vec3 col = mix(horizon, zenith, pow(clamp(d.y, 0.0, 1.0), 0.45));
  col = mix(col, deep, smoothstep(-1.0, 0.0, d.y));
  float s = pow(max(dot(d, uSunDir), 0.0), 1400.0);
  col += s * uSunColor * 3.2;
  col += pow(max(dot(d, uSunDir), 0.0), 60.0) * uSunColor * 0.12;
  return col;
}
`;

const GLASS_VERT = `
varying vec3 vWorldPos;
varying vec3 vNormalW;
varying vec2 vUv;
void main(){
  vUv = uv;
  vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
  vNormalW = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
  gl_Position = projectionMatrix * viewMatrix * vec4(vWorldPos, 1.0);
}
`;

const GLASS_FRAG = FRAG_PROJ + `
varying vec3 vWorldPos;
varying vec3 vNormalW;
varying vec2 vUv;
uniform sampler2D tSceneMap;
uniform float uTime;
uniform vec3 uTint;
void main(){
  vec3 n = normalize(vNormalW);
  vec3 V = normalize(cameraPosition - vWorldPos);
  float facing = abs(dot(n, V));
  float fres = pow(1.0 - facing, 5.0);
  vec4 clip = projectionMatrix * viewMatrix * vec4(vWorldPos, 1.0);
  vec2 uv = clip.xy / clip.w * 0.5 + 0.5;
  vec3 R = refract(-V, n, 0.6667);
  vec2 off = R.xy * (0.006 + 0.028 * (1.0 - facing));
  vec2 uv2 = clamp(uv + off, vec2(0.0005), vec2(0.9995));
  vec3 col = texture2D(tSceneMap, uv2).rgb;
  col *= uTint;
  vec3 refl = envColor(reflect(-V, n));
  vec3 outCol = mix(col, refl, fres * 0.55);
  float spec = pow(max(dot(reflect(-V, n), uSunDir), 0.0), 240.0) * 3.0;
  outCol += spec * vec3(1.0, 0.97, 0.9);
  float glint = pow(max(dot(reflect(-V, n), uSunDir), 0.0), 900.0) * 2.5;
  outCol += glint * vec3(1.0, 0.98, 0.92);
  float alpha = 0.055 + fres * 0.5 + spec * 0.35;
  gl_FragColor = vec4(outCol, alpha);
}
`;

const refrMaterials = [];
const refractionHidden = [];

function makeGlassMaterial(tint) {
  const m = new THREE.ShaderMaterial({
    vertexShader: GLASS_VERT,
    fragmentShader: ENV_GLSL + GLASS_FRAG,
    uniforms: {
      tSceneMap: { value: null },
      uTime: { value: 0 },
      uSunDir: { value: new THREE.Vector3(0.42, 0.85, 0.31).normalize() },
      uSunColor: { value: new THREE.Color(1.0, 0.94, 0.82) },
      uTint: { value: new THREE.Color(tint || 0xbfd6e8) },
    },
    transparent: true, depthWrite: false,
    side: THREE.DoubleSide,
  });
  m.renderOrder = 40;
  m.userData.refr = true;
  refrMaterials.push(m);
  return m;
}

function makePane(w, h, t, tint) {
  const geo = new THREE.BoxGeometry(w, h, t);
  const mesh = new THREE.Mesh(geo, makeGlassMaterial(tint));
  mesh.userData.excludeFromRefraction = true;
  refractionHidden.push(mesh);
  return mesh;
}

function buildTank() {
  const g = new THREE.Group();
  const t = TANK.glass, W = TANK.w, D = TANK.d, H = TANK.h, y0 = TANK.y0;
  const dark = new THREE.MeshStandardMaterial({ color: 0x14171d, roughness: 0.65, metalness: 0.35 });

  // glass panes
  const front = makePane(W + 2 * t, H, t);
  front.position.set(0, y0 + H / 2, D / 2 + t / 2);
  const back = makePane(W + 2 * t, H, t);
  back.position.set(0, y0 + H / 2, -(D / 2 + t / 2));
  const left = makePane(t, H, D + 2 * t);
  left.position.set(-(W / 2 + t / 2), y0 + H / 2, 0);
  const right = makePane(t, H, D + 2 * t);
  right.position.set(W / 2 + t / 2, y0 + H / 2, 0);
  const bottom = makePane(W + 2 * t, t, D + 2 * t);
  bottom.position.set(0, y0 - t / 2, 0);
  g.add(front, back, left, right, bottom);

  // seal seams (inner corner strips)
  const seamMat = new THREE.MeshStandardMaterial({ color: 0x0a0d12, roughness: 0.9 });
  const sh = H * 0.999, ss = 0.014;
  const corners = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
  for (const [sx, sz] of corners) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(ss * 2, sh, ss * 2), seamMat);
    s.position.set(sx * (W / 2 - ss), y0 + H / 2, sz * (D / 2 - ss));
    g.add(s);
  }

  // matte black frame under the bottom
  const frame = new THREE.Mesh(new THREE.BoxGeometry(W + 2 * t + 0.10, 0.18, D + 2 * t + 0.10), dark);
  frame.position.set(0, y0 - t - 0.09, 0);
  g.add(frame);

  // upper rim
  const rimMat = new THREE.MeshStandardMaterial({ color: 0x11141a, roughness: 0.6, metalness: 0.2 });
  const yRim = TANK.rimY - 0.07;
  const rf = new THREE.Mesh(new THREE.BoxGeometry(W + 2 * t + 0.22, 0.14, 0.15), rimMat);
  rf.position.set(0, yRim, D / 2 + t + 0.075);
  const rb = rf.clone(); rb.position.z = -rf.position.z;
  const rl = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.14, D + 2 * t + 0.30), rimMat);
  rl.position.set(-(W / 2 + t + 0.075), yRim, 0);
  const rr = rl.clone(); rr.position.x = -rl.position.x;
  g.add(rf, rb, rl, rr);

  // pedestal
  const ped = new THREE.Mesh(new THREE.BoxGeometry(W + 2 * t + 0.65, 0.42, D + 2 * t + 0.65), new THREE.MeshStandardMaterial({ color: 0x0c0e13, roughness: 0.85 }));
  ped.position.set(0, y0 - t - 0.18 - 0.21, 0);
  ped.castShadow = false; ped.receiveShadow = true;
  g.add(ped);

  // soft contact shadow disc
  const shadowCanvas = document.createElement('canvas');
  shadowCanvas.width = shadowCanvas.height = 128;
  const cx = shadowCanvas.getContext('2d');
  const rg = cx.createRadialGradient(64, 64, 4, 64, 64, 64);
  rg.addColorStop(0, 'rgba(0,0,0,0.62)');
  rg.addColorStop(0.55, 'rgba(0,0,0,0.28)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  cx.fillStyle = rg; cx.fillRect(0, 0, 128, 128);
  const stTex = new THREE.CanvasTexture(shadowCanvas);
  const shadowPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(11, 11),
    new THREE.MeshBasicMaterial({ map: stTex, transparent: true, depthWrite: false })
  );
  shadowPlane.rotation.x = -Math.PI / 2;
  shadowPlane.position.set(0, y0 - t - 0.18 - 0.02, 0);
  shadowPlane.renderOrder = 1;
  g.add(shadowPlane);

  scene.add(g);
  return g;
}

function buildEnvironment() {
  const bgMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      uTime: { value: 0 },
      uSunDir: { value: new THREE.Vector3(0.42, 0.85, 0.31).normalize() },
      uSunColor: { value: new THREE.Color(1.0, 0.94, 0.82) },
    },
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = (modelMatrix * vec4(position, 1.0)).xyz - cameraPosition;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform float uTime;
      uniform vec3 uSunDir;
      uniform vec3 uSunColor;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p){
        vec2 i = floor(p); vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.,0.)), f.x),
                   mix(hash(i + vec2(0.,1.)), hash(i + vec2(1.,1.)), f.x), f.y);
      }
      void main(){
        vec3 d = normalize(vDir);
        float h = d.y * 0.5 + 0.5;
        vec3 horizon = vec3(0.105, 0.20, 0.30);
        vec3 zenith  = vec3(0.045, 0.10, 0.20);
        vec3 deep    = vec3(0.018, 0.035, 0.075);
        vec3 col = mix(horizon, zenith, pow(clamp(d.y, 0.0, 1.0), 0.5));
        col = mix(col, deep, smoothstep(-1.0, 0.0, d.y));
        // large cloud-like mottling to break banding
        float n = noise(d.xz * 2.2 + vec2(uTime * 0.003, 0.0));
        col = mix(col, col * (0.94 + 0.12 * n), smoothstep(0.0, 0.7, d.y));
        float s = pow(max(dot(d, uSunDir), 0.0), 1600.0);
        col += s * uSunColor * 3.0;
        col += pow(max(dot(d, uSunDir), 0.0), 90.0) * uSunColor * 0.14;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const sphere = new THREE.Mesh(new THREE.SphereGeometry(70, 48, 32), bgMat);
  sphere.renderOrder = -10;
  scene.add(sphere);
  envBgMat = bgMat;
  return bgMat;
}

let keyLight = null;
let envBgMat = null;
function buildLights() {
  const key = new THREE.DirectionalLight(0xfff3e0, 1.9);
  keyLight = key;
  key.position.set(4.6, 9.5, 3.8);
  key.castShadow = true;
  key.shadow.mapSize.set(1536, 1536);
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 26;
  key.shadow.camera.left = -7; key.shadow.camera.right = 7;
  key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
  key.shadow.bias = -0.0012;
  key.shadow.normalBias = 0.02;
  scene.add(key);

  const hemi = new THREE.HemisphereLight(0xdfeaff, 0x1c2430, 0.55);
  scene.add(hemi);

  const rim = new THREE.DirectionalLight(0x9fc8ff, 0.5);
  rim.position.set(-5, 3.5, -5.5);
  scene.add(rim);
}

/* ================= STAGE 2: WATER & REFRACTION ================= */

/* ---------- water simulation & refraction ---------- */
const WAVE_GLSL = `
float waveH(vec2 p, float t){
  float h = 0.0;
  h += 0.034 * sin(p.x * 1.70 + t * 0.80) * cos(p.y * 1.10 - t * 0.60);
  h += 0.021 * sin(p.x * 3.10 - t * 1.30 + 1.70) * sin(p.y * 2.60 + t * 0.90);
  h += 0.012 * sin(p.x * 5.30 + t * 1.10) * sin(p.y * 4.70 - t * 1.40 + 2.10);
  h += 0.0075 * sin((p.x + p.y) * 7.30 - t * 2.10 + 0.50) * cos((p.y - p.x) * 6.10 + t * 1.70);
  h += 0.004 * sin(p.x * 11.0 + t * 2.60) * sin(p.y * 9.0 - t * 2.30);
  return h;
}
vec3 waveN(vec2 p, float t){
  float d = 0.35;
  float hx = (waveH(p + vec2(d, 0.0), t) - waveH(p - vec2(d, 0.0), t)) / (2.0 * d);
  float hz = (waveH(p + vec2(0.0, d), t) - waveH(p - vec2(0.0, d), t)) / (2.0 * d);
  return normalize(vec3(-hx, 1.0, -hz));
}
`;

const WATER_VERT = `
uniform float uTime;
varying vec3 vWorldPos;
varying vec3 vNormal;
varying vec2 vUv;
varying float vViewZ;
void main(){
  vUv = uv;
  vec2 p = position.xz;
  float h = waveH(p, uTime);
  vec3 pos = vec3(position.x, h, position.z);
  vec4 wp = modelMatrix * vec4(pos, 1.0);
  vWorldPos = wp.xyz;
  vNormal = normalize(mat3(modelMatrix) * waveN(p, uTime));
  vec4 vp = viewMatrix * wp;
  vViewZ = -vp.z;
  gl_Position = projectionMatrix * vp;
}
`;

const WATER_FRAG = FRAG_PROJ + `
varying vec3 vWorldPos;
varying vec3 vNormal;
varying vec2 vUv;
varying float vViewZ;
uniform sampler2D tSceneMap;
uniform sampler2D tSceneDepth;
uniform float uTime;
uniform float uAbsorption;
uniform vec4 uRipples[12];
uniform int uRippleCount;
float linearize(float d){
  float ndc = d * 2.0 - 1.0;
  return projectionMatrix[3][2] / (ndc + projectionMatrix[2][2]);
}
float rippleTerm(vec4 r, vec2 p, float t){
  float age = t - r.z;
  if (age < 0.0 || age > 4.0) return 0.0;
  float life = 1.0 - age / 4.0;
  float dist = distance(p, r.xy);
  float sigma = 0.5 + age * 0.75;
  float g = exp(-dist * dist / (2.0 * sigma * sigma));
  float ring = cos(dist * 14.0 - age * 10.0);
  return ring * g * life * r.w;
}
float rippleBump(vec2 p, float t){
  float b = 0.0;
  if (uRippleCount > 0) b += rippleTerm(uRipples[0], p, t);
  if (uRippleCount > 1) b += rippleTerm(uRipples[1], p, t);
  if (uRippleCount > 2) b += rippleTerm(uRipples[2], p, t);
  if (uRippleCount > 3) b += rippleTerm(uRipples[3], p, t);
  if (uRippleCount > 4) b += rippleTerm(uRipples[4], p, t);
  if (uRippleCount > 5) b += rippleTerm(uRipples[5], p, t);
  if (uRippleCount > 6) b += rippleTerm(uRipples[6], p, t);
  if (uRippleCount > 7) b += rippleTerm(uRipples[7], p, t);
  if (uRippleCount > 8) b += rippleTerm(uRipples[8], p, t);
  if (uRippleCount > 9) b += rippleTerm(uRipples[9], p, t);
  if (uRippleCount > 10) b += rippleTerm(uRipples[10], p, t);
  if (uRippleCount > 11) b += rippleTerm(uRipples[11], p, t);
  return b;
}
void main(){
  vec2 p = vWorldPos.xz;
  vec3 n = normalize(vNormal);
  float bump = rippleBump(p, uTime);
  if (bump != 0.0) {
    vec2 g = vec2(0.0);
    float d = 0.08;
    g.x = (rippleBump(p + vec2(d, 0.0), uTime) - rippleBump(p - vec2(d, 0.0), uTime)) / (2.0 * d);
    g.y = (rippleBump(p + vec2(0.0, d), uTime) - rippleBump(p - vec2(0.0, d), uTime)) / (2.0 * d);
    n = normalize(n + vec3(-g.x * 0.55, 0.0, -g.y * 0.55));
  }
  vec3 V = normalize(cameraPosition - vWorldPos);
  float facing = abs(dot(n, V));
  float fres = pow(1.0 - facing, 5.0);

  vec4 clip = projectionMatrix * viewMatrix * vec4(vWorldPos, 1.0);
  vec2 uv0 = clip.xy / clip.w * 0.5 + 0.5;

  // refraction
  vec3 R = refract(-V, n, 0.75); // 1/1.333
  if (length(R) < 0.001) R = reflect(-V, n);
  float sceneDist = linearize(texture2D(tSceneDepth, uv0).r);
  float travel = max(sceneDist - vViewZ, 0.0);
  vec3 Rv = normalize(mat3(viewMatrix) * R);
  float tR = travel / max(abs(Rv.z), 1e-5);
  vec3 pView = (viewMatrix * vec4(vWorldPos, 1.0)).xyz + Rv * tR;
  vec4 clip2 = projectionMatrix * vec4(pView, 1.0);
  vec2 uv2 = clip2.xy / clip2.w * 0.5 + 0.5;

  float edgeFade = smoothstep(0.0, 0.06, min(min(uv2.x, 1.0 - uv2.x), min(uv2.y, 1.0 - uv2.y)));
  uv2 = mix(uv0, uv2, edgeFade);
  vec2 sampleUv = clamp(uv2, vec2(0.001), vec2(0.999));

  vec3 col = texture2D(tSceneMap, sampleUv).rgb;
  float absorb = 1.0 - exp(-travel * uAbsorption);
  col = mix(col, vec3(0.16, 0.30, 0.42), absorb * 0.55);

  // reflection
  vec3 refl = envColor(reflect(-V, n));
  vec3 outCol = mix(col, refl, fres * 0.5);
  float spec = pow(max(dot(reflect(-V, n), uSunDir), 0.0), 320.0) * 2.2;
  outCol += spec * vec3(1.0, 0.97, 0.90);
  outCol += bump * 0.03 * vec3(0.8, 0.95, 1.0);

  float alpha = smoothstep(0.0, 0.05, min(min(uv0.x, 1.0 - uv0.x), min(uv0.y, 1.0 - uv0.y)));
  gl_FragColor = vec4(outCol, alpha * 0.96);
}
`;

const waterSys = {
  surface: null,
  mat: null,
  ripples: [],
  capacity: 12,
  pushRipple(x, z, str) {
    this.ripples.push({ x, z, t0: simTime, s: str });
    if (this.ripples.length > this.capacity) this.ripples.shift();
  },
  build() {
    const geo = new THREE.PlaneGeometry(TANK.w * 0.995, TANK.d * 0.995, 120, 60);
    geo.rotateX(-Math.PI / 2); // lay the surface flat in XZ; the shader reads position.xz
    this.mat = new THREE.ShaderMaterial({
      vertexShader: WAVE_GLSL + WATER_VERT,
      fragmentShader: ENV_GLSL + WAVE_GLSL + WATER_FRAG,
      uniforms: {
        uTime: { value: 0 },
        tSceneMap: { value: null },
        tSceneDepth: { value: null },
        uAbsorption: { value: 0.32 },
        uSunDir: { value: new THREE.Vector3(0.42, 0.85, 0.31).normalize() },
        uSunColor: { value: new THREE.Color(1.0, 0.94, 0.82) },
        uRipples: { value: Array.from({ length: 12 }, () => new THREE.Vector4()) },
        uRippleCount: { value: 0 },
      },
      transparent: true,
      depthWrite: false,
    });
    this.mat.renderOrder = 25;
    this.surface = new THREE.Mesh(geo, this.mat);
    this.surface.position.y = TANK.waterY;
    this.surface.userData.excludeFromRefraction = true;
    refractionHidden.push(this.surface);
    scene.add(this.surface);
    this.meniscus = this.buildMeniscus();
  },
  buildMeniscus() {
    const g = new THREE.Group();
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec3 vWorldPos; varying vec2 vUv;
        void main(){ vUv = uv; vWorldPos = (modelMatrix * vec4(position,1.0)).xyz;
          gl_Position = projectionMatrix * viewMatrix * vec4(vWorldPos, 1.0); }`,
      fragmentShader: FRAG_PROJ + `
        varying vec3 vWorldPos; varying vec2 vUv;
        uniform float uTime;
        void main(){
          float edge = smoothstep(0.0, 0.5, min(vUv.x, 1.0 - vUv.x)) * smoothstep(0.0, 0.5, min(vUv.y, 1.0 - vUv.y));
          float s = pow(max(dot(normalize(cameraPosition - vWorldPos), vec3(0.0, 1.0, 0.0)), 0.0), 8.0);
          float alpha = edge * (0.25 + 0.7 * s);
          float tw = 0.05 + 0.02 * sin(vWorldPos.x * 14.0 + uTime * 1.6) * sin(vWorldPos.z * 11.0 - uTime * 1.2);
          gl_FragColor = vec4(vec3(0.72, 0.85, 0.95) * (0.6 + 0.5 * s), alpha * tw);
        }`,
      side: THREE.DoubleSide,
    });
    // frame strips around the perimeter at waterline
    const W = TANK.w, D = TANK.d;
    const strip = (len, pos) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.09), mat);
      m.position.copy(pos); m.rotation.x = 0; return m;
    };
    const a = strip(W, new THREE.Vector3(0, TANK.waterY, D / 2 - 0.02));
    const b = strip(W, new THREE.Vector3(0, TANK.waterY, -(D / 2 - 0.02)));
    const c = strip(D, new THREE.Vector3(W / 2 - 0.02, TANK.waterY, 0));
    c.rotation.y = Math.PI / 2;
    const d = strip(D, new THREE.Vector3(-(W / 2 - 0.02), TANK.waterY, 0));
    d.rotation.y = Math.PI / 2;
    g.add(a, b, c, d);
    scene.add(g);
    return g;
  },
  update() {
    this.mat.uniforms.uTime.value = simTime;
    const arr = this.mat.uniforms.uRipples.value;
    let n = 0;
    for (let i = 0; i < this.ripples.length; i++) {
      const r = this.ripples[i];
      if (simTime - r.t0 > 4.0) continue;
      arr[n].set(r.x, r.z, r.t0, r.s); n++;
    }
    this.mat.uniforms.uRippleCount.value = n;
    if (this.meniscus) {
      for (const c of this.meniscus.children) c.material.uniforms.uTime.value = simTime;
    }
  },
};

let rtScene = null, rtDepth = null;
function initRefractionTargets() {
  const w = Math.max(2, Math.floor(window.innerWidth * 0.5));
  const h = Math.max(2, Math.floor(window.innerHeight * 0.5));
  rtDepth = new THREE.DepthTexture(w, h);
  rtDepth.type = THREE.UnsignedIntType;
  rtScene = new THREE.WebGLRenderTarget(w, h, {
    type: THREE.UnsignedByteType,
    depthTexture: rtDepth,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
  });
  waterSys.mat.uniforms.tSceneMap.value = rtScene.texture;
  waterSys.mat.uniforms.tSceneDepth.value = rtDepth;
  for (const m of refrMaterials) m.uniforms.tSceneMap.value = rtScene.texture;
}

function renderRefractionPass() {
  for (const o of refractionHidden) o.visible = false;
  renderer.setRenderTarget(rtScene);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  for (const o of refractionHidden) o.visible = true;
}

/* ---------- internal sponge filter ---------- */
const FILTER_POS = new THREE.Vector3(2.15, 0, -1.15);
const NOZZLE = new THREE.Vector3(2.36, 1.9, -1.15); // airlift outlet, top of the tube

function buildFilter() {
  const g = new THREE.Group();
  const fx = FILTER_POS.x, fy = FILTER_POS.y, fz = FILTER_POS.z;
  const black = new THREE.MeshStandardMaterial({ color: 0x15171a, roughness: 0.62, metalness: 0.25 });

  // weighted base
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.47, 0.14, 24), black);
  base.position.set(fx, fy + 0.07, fz);
  g.add(base);

  // sponge body w/ porous surface
  const spongeGeo = new THREE.CylinderGeometry(0.3, 0.295, 0.78, 18, 12);
  {
    const pos = spongeGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const n = Math.sin(x * 53 + y * 27) * Math.cos(z * 61 + y * 13) * Math.sin(y * 91);
      const s = 1 + n * 0.05;
      pos.setXYZ(i, x * s, y, z * s);
    }
    spongeGeo.computeVertexNormals();
  }
  const spongeMat = new THREE.MeshStandardMaterial({ color: 0x111316, roughness: 0.95 });
  const sponge = new THREE.Mesh(spongeGeo, spongeMat);
  sponge.position.set(fx, fy + 0.14 + 0.39, fz);
  g.add(sponge);

  // grooves
  const grooveMat = new THREE.MeshStandardMaterial({ color: 0x060709, roughness: 0.9 });
  for (let i = 0; i < 3; i++) {
    const y = 0.22 + i * 0.2;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.31, 0.012, 8, 32), grooveMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.set(fx, fy + 0.14 + y, fz);
    g.add(ring);
  }

  // airlift tube + outlet
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.95, 14), black);
  tube.position.set(fx, fy + 0.14 + 0.78 + 0.475, fz);
  g.add(tube);
  const elbow = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.045, 10, 18, Math.PI / 2), black);
  elbow.position.set(fx + 0.09, fy + 0.14 + 0.78 + 0.95 - 0.02, fz);
  g.add(elbow);
  const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.035, 0.14, 12), black);
  nozzle.rotation.z = -Math.PI / 2;
  nozzle.position.set(fx + 0.18, fy + 0.14 + 0.78 + 0.95 - 0.02, fz);
  g.add(nozzle);

  // airline hose over the rear rim
  const hosePts = [
    new THREE.Vector3(fx + 0.16, fy + 0.14 + 0.78 + 0.95 + 0.04, fz),
    new THREE.Vector3(fx + 0.3, 2.9, fz - 0.3),
    new THREE.Vector3(fx + 0.45, 4.2, fz - 0.7),
    new THREE.Vector3(fx + 0.5, 5.1, fz - 0.95),   // drapes over the rear rim (back pane at z = -2)
    new THREE.Vector3(fx + 0.9, 5.25, fz - 1.5),
    new THREE.Vector3(fx + 1.6, 5.0, fz - 2.3),
    new THREE.Vector3(fx + 2.4, 4.6, fz - 3.0),
  ];
  const hoseCurve = new THREE.CatmullRomCurve3(hosePts);
  const hose = new THREE.Mesh(
    new THREE.TubeGeometry(hoseCurve, 24, 0.028, 8, false),
    new THREE.MeshStandardMaterial({ color: 0x0d0f12, roughness: 0.75 })
  );
  g.add(hose);

  // suction cup on the rear pane
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.05, 16), black);
  cup.rotation.x = Math.PI / 2; // disc faces the rear pane
  cup.position.set(fx - 0.35, fy + 0.75, -(TANK.d / 2 - 0.025));
  g.add(cup);

  scene.add(g);
  return g;
}

/* ---------- bubbles ---------- */
const BUBBLE_VERT = `
attribute float aPhase;
attribute float aRadius;
uniform float uTime;
varying float vPhase;
varying vec3 vWorldPos;
varying vec3 vNormalW;
void main(){
  vPhase = aPhase;
  // ShaderMaterial does not apply instanceMatrix on its own, so every bubble must be placed here
  mat4 model = modelMatrix * instanceMatrix;
  vec4 wp = model * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  vNormalW = normalize(mat3(model) * normal);
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;
const BUBBLE_FRAG = FRAG_PROJ + `
varying float vPhase;
varying vec3 vWorldPos;
varying vec3 vNormalW;
uniform float uTime;
void main(){
  vec3 V = normalize(cameraPosition - vWorldPos);
  float f = abs(dot(normalize(vNormalW), V));
  float glow = pow(1.0 - f, 3.2);
  vec3 col = mix(vec3(0.10, 0.18, 0.27), vec3(0.85, 0.95, 1.0), glow * 0.75);
  float spark = pow(max(dot(reflect(-V, normalize(vNormalW)), vec3(0.42, 0.85, 0.31)), 0.0), 60.0);
  col += spark * 0.9;
  float wob = 0.5 + 0.5 * sin(vPhase * 40.0 + uTime * 6.0);
  gl_FragColor = vec4(col, 0.85 + 0.1 * wob);
}
`;
const bubbleSys = {
  pool: null,
  geo: null,
  capacity: 140,
  data: null, // {x,y,z,vx,vy,vz,r,phase,alive}
  cursor: 0,
  timer: 0,
  build() {
    this.geo = new THREE.SphereGeometry(1, 14, 10);
    const mat = new THREE.ShaderMaterial({
      vertexShader: BUBBLE_VERT,
      fragmentShader: BUBBLE_FRAG,
      uniforms: { uTime: { value: 0 } },
      transparent: true, depthWrite: false,
    });
    mat.renderOrder = 26;
    this.pool = new THREE.InstancedMesh(this.geo, mat, this.capacity);
    this.pool.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.pool.frustumCulled = false;
    this.data = new Array(this.capacity);
    for (let i = 0; i < this.capacity; i++) {
      this.data[i] = { alive: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, r: 0.032, phase: rand() * 100, wob: 0 };
    }
    const phaseArr = new Float32Array(this.capacity);
    const radiusArr = new Float32Array(this.capacity);
    for (let i = 0; i < this.capacity; i++) { phaseArr[i] = rand() * 100; radiusArr[i] = 0.032; }
    this.pool.geometry.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phaseArr, 1));
    this.pool.geometry.setAttribute('aRadius', new THREE.InstancedBufferAttribute(radiusArr, 1));
    for (let i = 0; i < this.capacity; i++) this.pool.setMatrixAt(i, mHidden);
    this.pool.instanceMatrix.needsUpdate = true;
    // bubbles stay in the refraction capture so the glass panes draw them instead of covering them
    scene.add(this.pool);
  },
  spawn(x, y, z) {
    const d = this.data[this.cursor];
    const r = rrange(0.018, 0.055);
    d.alive = true;
    d.x = x + rrange(-0.03, 0.03);
    d.y = y;
    d.z = z + rrange(-0.03, 0.03);
    d.vx = rrange(-0.02, 0.02);
    d.vy = rrange(0.55, 0.95);
    d.vz = rrange(-0.02, 0.02);
    d.r = r;
    d.wob = rrange(0.4, 1.2);
    d.phase = rand() * 100;
    this.cursor = (this.cursor + 1) % this.capacity;
  },
  kill(i) { this.data[i].alive = false; },
  update(dt) {
    const p = this.pool;
    const counts = p.count;
    for (let i = 0; i < counts; i++) {
      const d = this.data[i];
      if (!d.alive) { p.setMatrixAt(i, mHidden); continue; }
      const cu = currentAt(d.x, d.y, d.z);
      d.x += (d.vx + cu.x) * dt;
      d.y += d.vy * dt;
      d.z += (d.vz + cu.z) * dt;
      d.x += Math.sin(simTime * d.wob * 9 + d.phase) * 0.006;
      d.z += Math.cos(simTime * d.wob * 7 + d.phase * 1.3) * 0.006;
      if (d.y >= TANK.waterY - 0.05) {
        waterSys.pushRipple(d.x, d.z, clamp(2.2 - d.r * 40, 0.5, 1.6));
        d.alive = false;
        p.setMatrixAt(i, mHidden);
        continue;
      }
      setInstMatrix(p, i, d.x, d.y, d.z, d.r);
    }
    p.instanceMatrix.needsUpdate = true;
    p.material.uniforms.uTime.value = simTime;
  },
};

const mHidden = new THREE.Matrix4().makeScale(0.0001, 0.0001, 0.0001);
const mTmp = new THREE.Matrix4();
function setInstMatrix(mesh, i, x, y, z, s) {
  mTmp.makeScale(s, s, s);
  mTmp.setPosition(x, y, z);
  mesh.setMatrixAt(i, mTmp);
}
const _cur = new THREE.Vector3();
function defineCurrentField() {
  currentAt = (x, y, z) => {
    const dx = x - FILTER_POS.x, dz = z - FILTER_POS.z;
    const r = Math.hypot(dx, dz);
    const up = Math.exp(-r * r / 1.6) * 0.9 * Math.exp(-(y - 1.0) * 0.25) * 0.5;
    _cur.set(
      -dx * 0.012 * Math.exp(-r * 0.5) + Math.sin(y * 0.7 + simTime * 0.5) * 0.008,
      up,
      -dz * 0.012 * Math.exp(-r * 0.5) + Math.cos(y * 0.5 + simTime * 0.4) * 0.008
    );
    return _cur;
  };
}
let currentAt = (x, y, z) => _cur.set(0, 0, 0);

/* ================= STAGE 4: PEBBLE BED ================= */

/* ---------- pebble bed ---------- */
const PEBBLE_PALETTE = [0x9a8b77, 0x7d746a, 0x555a62, 0x4a3f34, 0x8c8070, 0x6b655d, 0xb8ad9c, 0x3c4048];
function rockify(geo, seed, amp, smoothIters) {
  const pos = geo.attributes.position;
  const tmp = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    tmp.set(pos.getX(i), pos.getY(i), pos.getZ(i)).normalize();
    const n = Math.sin(tmp.x * 12.9898 + seed * 78.233) * Math.cos(tmp.y * 78.233 + seed * 12.9898) *
      Math.sin(tmp.z * 39.1 + seed * 4.7);
    const s = 1 + n * amp;
    pos.setXYZ(i, tmp.x * s, tmp.y * s, tmp.z * s);
  }
  geo.computeVertexNormals();
  return geo;
}
function buildPebbleGeoms() {
  const gs = [];
  gs.push(rockify(new THREE.IcosahedronGeometry(1, 1), 3.7, 0.14, 1));
  gs.push(rockify(new THREE.DodecahedronGeometry(1, 0), 9.2, 0.12, 0));
  gs.push(rockify(new THREE.IcosahedronGeometry(1, 0), 17.5, 0.10, 1));
  const g3 = new THREE.SphereGeometry(1, 8, 6);
  rockify(g3, 31.7, 0.08, 1);
  gs.push(g3);
  return gs;
}

let groundHeightAt = (x, z) => 0.06;
function defineGroundHeight() {
  groundHeightAt = (x, z) => {
    let y = 0.055 + (z + TANK.d * 0.5) * 0.02; // gentle slope up to back
    // mounds: castle area, filter, plant anchors
    y += Math.exp(-((x + 0.4) * (x + 0.4) + (z + 0.3) * (z + 0.3)) / 1.4) * 0.055;
    y += Math.exp(-((x - 2.15) * (x - 2.15) + (z + 1.15) * (z + 1.15)) / 1.2) * 0.045;
    y += Math.exp(-((x - 1.6) * (x - 1.6) + (z - 1.55) * (z - 1.55)) / 1.0) * 0.04;
    y += Math.exp(-((x + 2.5) * (x + 2.5) + (z - 1.4) * (z - 1.4)) / 1.0) * 0.04;
    y += Math.exp(-((x - 1.0) * (x - 1.0) + (z + 1.4) * (z + 1.4)) / 0.9) * 0.04;
    y += Math.exp(-((x + 2.8) * (x + 2.8) + (z + 1.2) * (z + 1.2)) / 0.9) * 0.04;
    y += Math.sin(x * 13.7 + z * 9.3) * 0.006;
    return y;
  };
}

function buildPebbleBed() {
  const geoms = buildPebbleGeoms();
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.96, metalness: 0.02, flatShading: true });
  const halfW = TANK.w / 2 - 0.45, halfD = TANK.d / 2 - 0.45;
  const c = new THREE.Color();
  const counts = [200, 170, 170];
  const beds = [];
  for (let g = 0; g < geoms.length; g++) {
    const bed = new THREE.InstancedMesh(geoms[g], mat, counts[g]);
    bed.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    bed.castShadow = true; bed.receiveShadow = true;
    const q = new THREE.Quaternion();
    const e = new THREE.Euler();
    for (let i = 0; i < counts[g]; i++) {
      const x = rrange(-halfW, halfW);
      const z = rrange(-halfD, halfD);
      const y = groundHeightAt(x, z) + rrange(0, 0.04);
      const s = rrange(0.06, 0.17);
      const sq = rrange(0.6, 1.0);
      e.set(rrange(0, Math.PI), rrange(0, Math.PI), rrange(0, Math.PI));
      q.setFromEuler(e);
      mTmp.compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(s, s * sq, s));
      bed.setMatrixAt(i, mTmp);
      c.setHex(PEBBLE_PALETTE[(rand() * PEBBLE_PALETTE.length) | 0]);
      c.multiplyScalar(rrange(0.85, 1.18));
      bed.setColorAt(i, c);
    }
    bed.instanceMatrix.needsUpdate = true;
    if (bed.instanceColor) bed.instanceColor.needsUpdate = true;
    scene.add(bed);
    beds.push(bed);
  }

  // larger accent stones
  const accCount = 16;
  const accents = new THREE.InstancedMesh(geoms[2], mat, accCount);
  accents.castShadow = true; accents.receiveShadow = true;
  for (let i = 0; i < accCount; i++) {
    const x = rrange(-halfW + 0.5, halfW - 0.5);
    const z = rrange(-halfD + 0.5, halfD - 0.5);
    const y = groundHeightAt(x, z) + rrange(0.0, 0.05);
    const s = rrange(0.3, 0.52);
    accents.setMatrixAt(i, mTmp.compose(
      new THREE.Vector3(x, y, z),
      new THREE.Quaternion().setFromEuler(new THREE.Euler(rrange(0, Math.PI), rrange(0, Math.PI), rrange(0, Math.PI))),
      new THREE.Vector3(s, s * rrange(0.6, 0.9), s)
    ));
    c.setHex(PEBBLE_PALETTE[(rand() * PEBBLE_PALETTE.length) | 0]);
    accents.setColorAt(i, c);
  }
  accents.instanceMatrix.needsUpdate = true;
  if (accents.instanceColor) accents.instanceColor.needsUpdate = true;
  scene.add(accents);
  return { beds, accents };
}

/* ================= STAGE 5: CASTLE ================= */

/* ---------- castle ---------- */
const CAUSTIC_GLSL = `
float causticIntensity(vec2 p, float t){
  float v = 0.0;
  v += 0.60 * sin(p.x * 2.30 + t * 1.40) * sin(p.y * 2.10 - t * 1.20);
  v += 0.40 * sin(p.x * 5.10 - t * 0.90) * sin(p.y * 4.70 + t * 0.80 + 1.30);
  v += 0.30 * sin(p.x * 8.70 + t * 1.80) * sin(p.y * 9.30 - t * 1.50);
  v += 0.20 * sin(p.x * 13.0 - t * 2.40) * sin(p.y * 12.0 + t * 2.10);
  float b = smoothstep(-0.35, 1.3, v);
  return b * b * (0.35 + 0.65 * smoothstep(0.2, 1.4, v));
}
`;

const CASTLE_VERT = `
varying vec3 vWorldPos;
varying vec3 vNormalW;
varying float vLocalY;
void main(){
  vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
  vNormalW = normalize(mat3(modelMatrix) * normal);
  vLocalY = position.y;
  gl_Position = projectionMatrix * viewMatrix * vec4(vWorldPos, 1.0);
}
`;

const CASTLE_FRAG = FRAG_PROJ + `
varying vec3 vWorldPos;
varying vec3 vNormalW;
varying float vLocalY;
uniform sampler2D uShadowMap;
uniform mat4 uShadowMatrix;
uniform vec3 uLightDir;
uniform vec3 uLightColor;
uniform float uTime;
uniform float uCausticStrength;
uniform vec3 uCausticColor;
uniform vec3 uStoneColor;
uniform vec3 uMossColor;
uniform float uRough;
float noise2(vec2 p){
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}
// three.js stores the shadow map as RGBA-packed depth, so unpack it before comparing
float shadowDepth(vec2 uv){
  return dot(texture2D(uShadowMap, uv), vec4(1.0 / 16777216.0, 1.0 / 65536.0, 1.0 / 256.0, 1.0));
}
float calcShadow(vec4 sc){
  vec3 p = sc.xyz / sc.w; // shadow matrix already maps to [0,1]
  if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0) return 1.0;
  float bias = 0.0015;
  float s = 0.0;
  s += step(p.z - bias, shadowDepth(p.xy + vec2(-0.0016)));
  s += step(p.z - bias, shadowDepth(p.xy + vec2( 0.0016)));
  s += step(p.z - bias, shadowDepth(p.xy + vec2( 0.0, -0.0016)));
  s += step(p.z - bias, shadowDepth(p.xy + vec2( 0.0,  0.0016)));
  return s * 0.25;
}
void main(){
  vec3 N = normalize(vNormalW);
  vec3 V = normalize(cameraPosition - vWorldPos);
  vec4 sc = uShadowMatrix * vec4(vWorldPos, 1.0);
  float sh = calcShadow(sc);
  float ndl = max(dot(N, uLightDir), 0.0);
  // stone course striping + weathering
  // brick courses: rows every 0.16, staggered by half a brick on every other row
  float row = vWorldPos.y / 0.16;
  float rowId = floor(row);
  float bx = (vWorldPos.x + vWorldPos.z) / 0.34 + 0.5 * mod(rowId, 2.0);
  vec2 cell = floor(vec2(bx, row));
  vec2 bf = fract(vec2(bx, row));
  float edge = min(min(bf.x, 1.0 - bf.x), min(bf.y, 1.0 - bf.y));
  float mortar = 1.0 - smoothstep(0.035, 0.07, edge);
  float brickTone = 0.85 + 0.3 * noise2(cell);
  float grain = noise2(vWorldPos.xz * 9.0) * 0.5 + noise2(vWorldPos.xz * 31.0) * 0.5;
  vec3 brick = uStoneColor * brickTone * (0.9 + 0.12 * grain);
  vec3 mortarCol = uStoneColor * 0.55;
  vec3 base = mix(brick, mortarCol, mortar);
  float moss = smoothstep(0.0, 0.85, -vLocalY + 0.25);
  base = mix(base, uMossColor, moss * 0.55);
  vec3 col = base * (0.32 + sh * ndl * uLightColor);
  // ambient occlusion-ish at base
  col *= 1.0 - moss * 0.25;
  // caustics
  float ca = causticIntensity(vWorldPos.xz, uTime);
  col += ca * uCausticColor * uCausticStrength;
  // subtle spec
  float spec = pow(max(dot(reflect(-V, N), uLightDir), 0.0), 26.0) * sh * 0.10;
  col += spec;
  gl_FragColor = vec4(col, 1.0);
}
`;

let castleObstacles = [];
let castleGroup = null;
let castleMat = null;

function makeCastleMaterial() {
  const m = new THREE.ShaderMaterial({
    vertexShader: CASTLE_VERT,
    fragmentShader: CAUSTIC_GLSL + CASTLE_FRAG,
    uniforms: {
      uShadowMap: { value: null },
      uShadowMatrix: { value: new THREE.Matrix4() },
      uLightDir: { value: new THREE.Vector3(0.42, 0.85, 0.31).normalize() },
      uLightColor: { value: new THREE.Color(2.6, 2.3, 1.9) },
      uTime: { value: 0 },
      uCausticStrength: { value: 0.16 },
      uCausticColor: { value: new THREE.Color(0.32, 0.48, 0.55) },
      uStoneColor: { value: new THREE.Color(0.62, 0.59, 0.54) },
      uMossColor: { value: new THREE.Color(0.24, 0.38, 0.28) },
    },
  });
  return m;
}

function castleBox(w, h, d, x, y, z, rotY = 0) {
  const ms = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), castleMat);
  ms.position.set(x, y, z);
  if (rotY) ms.rotation.y = rotY;
  ms.castShadow = true; ms.receiveShadow = true;
  castleGroup.add(ms);
  return ms;
}
function castleCyl(rTop, rBot, h, x, y, z, seg = 8) {
  const ms = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg), castleMat);
  ms.position.set(x, y, z);
  ms.castShadow = true; ms.receiveShadow = true;
  castleGroup.add(ms);
  return ms;
}
function crenellate(cx, cz, r, topY, n, size) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
    castleBox(size, size * 0.85, size, x, topY - size * 0.28, z, a);
  }
}

function buildCastle() {
  castleGroup = new THREE.Group();
  const cx = -0.55, cz = -0.35;
  const TOWER_Z = -0.2; // main tower sits behind the gate so the doorway is not blocked by its solid body
  const gy = groundHeightAt(cx, cz) + 0.06;
  castleGroup.position.set(cx, gy, cz);
  castleMat = makeCastleMaterial();

  // foundation
  castleCyl(1.45, 1.6, 0.3, 0, 0.15, 0, 12);

  // main tower
  castleCyl(0.82, 0.9, 2.05, 0, 1.10, TOWER_Z, 8);
  crenellate(0, TOWER_Z, 0.86, 2.1, 8, 0.17);

  // side towers
  castleCyl(0.5, 0.56, 1.35, -1.05, 0.78, -0.25, 8);
  crenellate(-1.05, -0.25, 0.52, 1.45, 6, 0.14);
  castleCyl(0.62, 0.68, 1.6, 1.0, 0.9, 0.3, 8);
  crenellate(1.0, 0.3, 0.64, 1.7, 7, 0.15);

  // gatehouse: one solid block with a real arched opening, its depth is the wall thickness
  const gateZ = 0.5, gateD = 0.4;
  const gateShape = new THREE.Shape();
  gateShape.moveTo(-1.05, 0);
  gateShape.lineTo(1.05, 0);
  gateShape.lineTo(1.05, 1.95);
  gateShape.lineTo(-1.05, 1.95);
  gateShape.closePath();
  const doorway = new THREE.Path();
  doorway.moveTo(-0.39, 0);
  doorway.lineTo(0.39, 0);
  doorway.lineTo(0.39, 1.1);
  doorway.absarc(0, 1.1, 0.39, 0, Math.PI, false);
  doorway.lineTo(-0.39, 0);
  gateShape.holes.push(doorway);
  const gate = new THREE.Mesh(
    new THREE.ExtrudeGeometry(gateShape, { depth: gateD, bevelEnabled: false, curveSegments: 18 }),
    castleMat
  );
  gate.position.set(0, 0, gateZ);
  gate.castShadow = true; gate.receiveShadow = true;
  castleGroup.add(gate);
  // dark passage visible through the opening
  const passage = new THREE.Mesh(
    new THREE.BoxGeometry(0.78, 1.5, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x14100c, roughness: 0.95 })
  );
  passage.position.set(0, 0.75, 0.66);
  castleGroup.add(passage);
  // parapet above the gate
  for (let i = -2; i <= 2; i++) {
    castleBox(0.14, 0.22, 0.3, i * 0.33, 2.02, 0.75);
  }

  // connecting walls to side towers
  castleBox(0.5, 1.3, 0.3, -0.55, 0.78, -0.1, 0.32);
  castleBox(0.5, 1.45, 0.3, 0.55, 0.85, 0.2, -0.3);

  // recessed windows on the main tower
  for (let a = 0; a < 4; a++) {
    const ang = a * Math.PI / 2 + 0.5;
    const x = Math.cos(ang) * 0.86, z = TOWER_Z + Math.sin(ang) * 0.86;
    const w = new THREE.Mesh(
      new THREE.BoxGeometry(0.09, 0.22, 0.09),
      new THREE.MeshStandardMaterial({ color: 0x0a0c10, roughness: 1 })
    );
    w.position.set(x, a === 0 ? 1.15 : 1.5, z);
    w.lookAt(x * 2, w.position.y, TOWER_Z + (z - TOWER_Z) * 2);
    castleGroup.add(w);
  }

  // weathered chips: small light angular bits
  for (let i = 0; i < 10; i++) {
    const a = rand() * Math.PI * 2;
    const r = rrange(0.75, 1.3);
    const chip = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.07, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x8a827a, roughness: 0.9 })
    );
    chip.position.set(Math.cos(a) * r, rrange(0.1, 1.9), Math.sin(a) * r * 0.8);
    chip.rotation.set(rand() * 3, rand() * 3, rand() * 3);
    chip.castShadow = true;
    castleGroup.add(chip);
  }

  scene.add(castleGroup);

  // collision barriers
  castleObstacles = [
    { min: [-1.35, 0, -0.85], max: [1.35, 2.6, 1.35] },       // overall hull
    { min: [-1.0, 0, -0.55], max: [1.0, 1.0, 1.0] },           // wall line
    { min: [-0.42, 1.0, -0.5], max: [0.42, 1.7, 1.0] },        // lintel zone
    { min: [-1.35, 0, -0.9], max: [-0.7, 1.7, 0.8] },          // left tower+wall
    { min: [0.7, 0, -0.9], max: [1.35, 2.0, 0.9] },            // right tower+wall
  ];
  const doorRect = { min: [-0.55, 0.05, -0.5], max: [0.55, 1.1, 0.95] };
  castleObstacles.push(doorRect);
  // boxes above are in castle space; move them to world space so fish avoid the real castle
  castleObstacles = castleObstacles.map(o => ({
    min: [o.min[0] + cx, o.min[1], o.min[2] + cz],
    max: [o.max[0] + cx, o.max[1], o.max[2] + cz],
  }));
  return castleGroup;
}

/* ---------- plants ---------- */
const plantSystems = [];

function ribbonFromSpine(spine, widths, vSeg) {
  const N = spine.length;
  const pos = [];
  const col = [];
  const ua = [], va = [];
  for (let i = 0; i < N; i++) {
    const p = spine[i];
    const dir = i < N - 1
      ? new THREE.Vector3().subVectors(spine[i + 1], p).normalize()
      : new THREE.Vector3().subVectors(p, spine[i - 1]).normalize();
    let r = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0));
    if (r.lengthSq() < 1e-6) r.set(1, 0, 0);
    r.normalize();
    const u = i / (N - 1);
    for (let j = 0; j <= vSeg; j++) {
      const v = j / vSeg;
      const w = widths[i] * (v - 0.5) * 2;
      const q = p.clone().addScaledVector(r, w);
      pos.push(q.x, q.y, q.z);
      ua.push(u); va.push(v);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('aU', new THREE.Float32BufferAttribute(ua, 1));
  geo.setAttribute('aV', new THREE.Float32BufferAttribute(va, 1));
  // index
  const idx = [];
  for (let i = 0; i < N - 1; i++) {
    for (let j = 0; j < vSeg; j++) {
      const a = i * (vSeg + 1) + j;
      const b = a + 1;
      const c = a + (vSeg + 1);
      const d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

function makePlantMesh(geo, material, baseColor, tipColor) {
  const colors = new Float32Array(geo.attributes.position.count * 3);
  const uAttr = geo.attributes.aU;
  for (let i = 0; i < uAttr.count; i++) {
    const u = uAttr.getX(i);
    const c = new THREE.Color().lerpColors(baseColor, tipColor, u);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const m = new THREE.Mesh(geo, material);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

function buildVallisneria() {
  const g = new THREE.Group();
  const ax = -2.75, az = 1.4;
  const ay = groundHeightAt(ax, az) + 0.12;
  g.position.set(ax, ay, az);
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.7, side: THREE.DoubleSide });
  const meshes = [];
  const N = 10;
  for (let k = 0; k < N; k++) {
    const spine = [];
    const widths = [];
    const L = rrange(2.3, 3.1);
    const seg = 26;
    const bend = rrange(0.35, 0.85) * (rand() < 0.5 ? 1 : -1);
    const twist = rrange(-0.4, 0.4);
    for (let i = 0; i <= seg; i++) {
      const t = i / seg;
      const arch = Math.sin(t * Math.PI * 0.5) * 1.0;
      const y = t * L * 0.85;
      const z = t * t * L * bend * 0.4;
      const x = Math.sin(t * twist) * 0.12;
      spine.push(new THREE.Vector3(x, y, z));
      widths.push(0.16 * (1 - t * 0.82));
    }
    const rnd = (rand() - 0.5) * 0.25;
    const geo = ribbonFromSpine(spine, widths, 2);
    const mesh = makePlantMesh(geo, mat, new THREE.Color(0.18, 0.52, 0.22), new THREE.Color(0.34, 0.72, 0.3));
    mesh.position.set(rnd, 0, rnd * 0.8);
    mesh.rotation.y = (k / N) * Math.PI * 2;
    g.add(mesh);
    meshes.push({ mesh, phase: rand() * 10, amp: rrange(0.04, 0.09), frq: rrange(1.0, 1.8) });
  }
  scene.add(g);
  plantSystems.push({
    update() {
      for (const m of meshes) {
        const pos = m.mesh.geometry.attributes.position;
        const u = m.mesh.geometry.attributes.aU;
        const v = m.mesh.geometry.attributes.aV;
        const base = m.base ??= Float32Array.from(pos.array);
        const arr = pos.array;
        for (let i = 0; i < pos.count; i++) {
          const uu = u.getX(i), vv = v.getX(i);
          const flex = uu * uu;
          const t = simTime * 1.3 + m.phase;
          const sway = Math.sin(t * m.frq - uu * 3.4) * m.amp * flex;
          const sway2 = Math.cos(t * 0.8 + uu * 2.2 + vv * 2.0) * m.amp * 0.5 * flex;
          arr[i * 3] = base[i * 3] + sway * 0.35 + sway2 * 0.7;
          arr[i * 3 + 1] = base[i * 3 + 1] + sway2 * 0.2;
          arr[i * 3 + 2] = base[i * 3 + 2] + sway;
        }
        pos.needsUpdate = true;
        m.mesh.geometry.computeVertexNormals();
      }
    }
  });
}

function buildAnubias() {
  const g = new THREE.Group();

  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.62 });
  const meshes = [];

  // rhizome
  const rh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.075, 0.75, 10),
    new THREE.MeshStandardMaterial({ color: 0x2c3a24, roughness: 0.9 })
  );
  rh.rotation.z = Math.PI / 2;
  rh.position.set(0, 0.06, 0);
  g.add(rh);

  // leaves
  const nLeaves = 7;
  for (let k = 0; k < nLeaves; k++) {

    for (let i = 0; i <= seg; i++) {

      const y = petLen + t * leafLen;

      const z = arch;
      const x = Math.sin(t * 2.2) * 0.05;
      spine.push(new THREE.Vector3(x, y, z));
      widths.push(leafW * Math.sin(Math.min(t * 1.35, 1) * Math.PI));
    }
    const geo = ribbonFromSpine(spine, widths, 3);
    const mesh = makePlantMesh(geo, mat, new THREE.Color(0.10, 0.30, 0.14), new THREE.Color(0.16, 0.42, 0.20));
    mesh.position.set(bx, 0.07, bz);
    mesh.rotation.y = ang * 0.6 + Math.PI;
    g.add(mesh);
    meshes.push({ mesh, phase: rand() * 10, amp: rrange(0.008, 0.018), frq: rrange(0.4, 0.7) });
  }
  scene.add(g);
  plantSystems.push({
    update() {
      for (const m of meshes) {
        const pos = m.mesh.geometry.attributes.position;
        const u = m.mesh.geometry.attributes.aU;
        const base = m.base ??= Float32Array.from(pos.array);
        const arr = pos.array;
        for (let i = 0; i < pos.count; i++) {
          const uu = u.getX(i);
          const flex = uu * uu;
          const t = simTime * 0.7 + m.phase;
          const sway = Math.sin(t * m.frq - uu * 1.4) * m.amp * flex;
          arr[i * 3] = base[i * 3] + sway;
          arr[i * 3 + 2] = base[i * 3 + 2] + Math.cos(t * m.frq + uu) * m.amp * 0.55 * flex;
        }
        pos.needsUpdate = true;
        m.mesh.geometry.computeVertexNormals();
      }
    }
  });
}

      const x = t * lean * 0.15 + Math.sin(t * 5.0) * 0.018 * t;
      spine.push(new THREE.Vector3(x, y, z));
      widths.push(0.13 * Math.sin(Math.min(t * 1.5, 1) * Math.PI) * (1 - t * 0.15));

    const mesh = makePlantMesh(geo, mat, new THREE.Color(0.26, 0.40, 0.16), new THREE.Color(0.34, 0.52, 0.20));
    mesh.position.set((rand() - 0.5) * 0.18, 0.04, (rand() - 0.5) * 0.18);

        const arr = pos.array;
        for (let i = 0; i < pos.count; i++) {

          const t = simTime * 1.0 + m.phase;

          arr[i * 3] = base[i * 3] + sway * 0.6;
          arr[i * 3 + 1] = base[i * 3 + 1] + Math.cos(t * 0.6 + uu * 1.4) * 0.012 * flex;
          arr[i * 3 + 2] = base[i * 3 + 2] + sway;
        }
        pos.needsUpdate = true;
        m.mesh.geometry.computeVertexNormals();

function buildCabomba() {
  const g = new THREE.Group();
  const ax = 0.2, az = -1.8;
  const ay = groundHeightAt(ax, az) + 0.1;
  g.position.set(ax, ay, az);
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, side: THREE.DoubleSide });
  const meshes = [];
  const stems = 5;
  for (let k = 0; k < stems; k++) {
    const spine = [];
    const widths = [];
    const L = rrange(1.7, 2.45);
    const seg = 30;
    const leanX = rrange(-0.5, 0.5), leanZ = rrange(-0.5, 0.5);
    for (let i = 0; i <= seg; i++) {
      const t = i / seg;
      const y = t * L;
      const x = t * t * leanX * 0.5;
      const z = t * t * leanZ * 0.5 + Math.sin(t * 9.0) * 0.02;
      spine.push(new THREE.Vector3(x, y, z));
      widths.push(0.015);
    }
    const stemGeo = ribbonFromSpine(spine, widths, 1);
    const stem = makePlantMesh(stemGeo, mat, new THREE.Color(0.22, 0.42, 0.18), new THREE.Color(0.26, 0.52, 0.22));
    stem.position.set((rand() - 0.5) * 0.24, 0.02, (rand() - 0.5) * 0.24);
    g.add(stem);
    meshes.push({ mesh: stem, phase: rand() * 10, amp: rrange(0.10, 0.20), frq: rrange(1.5, 2.2) });

    // whorls along this stem
    const whorls = Math.floor(L / 0.22);
    for (let wIdx = 0; wIdx < whorls; wIdx++) {
      const wy = 0.18 + wIdx * 0.22;
      const leafCount = 6;
      for (let li = 0; li < leafCount; li++) {
        const ang = (li / leafCount) * Math.PI * 2 + rand() * 0.3;
        const leafSpine = [];
        const leafWidths = [];
        const lLen = rrange(0.14, 0.24);
        const ls = 5;
        for (let i = 0; i <= ls; i++) {
          const t = i / ls;
          leafSpine.push(new THREE.Vector3(Math.cos(ang) * t * lLen, 0, Math.sin(ang) * t * lLen));
          leafWidths.push(0.05 * Math.sin(Math.min(t * 1.5, 1) * Math.PI));
        }
        const geo = ribbonFromSpine(leafSpine, leafWidths, 1);
        const leaf = makePlantMesh(geo, mat, new THREE.Color(0.30, 0.60, 0.22), new THREE.Color(0.40, 0.72, 0.28));
        leaf.position.set(0, wy, 0);
        g.add(leaf);
        meshes.push({ mesh: leaf, phase: rand() * 10, amp: rrange(0.10, 0.20), frq: rrange(1.7, 2.5) });
      }
    }
  }
  scene.add(g);
  plantSystems.push({
    update() {
      for (const m of meshes) {
        const pos = m.mesh.geometry.attributes.position;
        const u = m.mesh.geometry.attributes.aU;
        const base = m.base ??= Float32Array.from(pos.array);
        const arr = pos.array;
        for (let i = 0; i < pos.count; i++) {
          const uu = u.getX(i);
          const flex = uu * uu;
          const t = simTime * 1.8 + m.phase;
          const sway = Math.sin(t * m.frq - uu * 4.5) * m.amp * flex;
          const sway2 = Math.cos(t * 1.1 + uu * 2.8) * m.amp * 0.5 * flex;
          arr[i * 3] = base[i * 3] + sway;
          arr[i * 3 + 1] = base[i * 3 + 1] + sway2 * 0.3;
          arr[i * 3 + 2] = base[i * 3 + 2] + sway2;
        }
        pos.needsUpdate = true;
        m.mesh.geometry.computeVertexNormals();
      }
    }
  });
}

/* ================= STAGES 7-10: FISH MODELS ================= */

/* ---------- fish model toolkit ---------- */
function bodyCylinder(L, R, N, segments) {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    const r = R(u);
    const z = (u - 0.5) * L;
    for (let j = 0; j <= segments; j++) {
      const a = (j / segments) * Math.PI * 2;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      pos.push(x, y, z);
    }
  }
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < segments; j++) {
      const a = i * (segments + 1) + j;
      const b = a + 1;
      const c = a + (segments + 1);
      const d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  const spine = new Float32Array((N + 1) * (segments + 1));
  const flex = new Float32Array((N + 1) * (segments + 1));
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    for (let j = 0; j <= segments; j++) {
      const k = i * (segments + 1) + j;
      spine[k] = u;
      flex[k] = u * u;
    }
  }
  geo.setAttribute('aSpine', new THREE.BufferAttribute(spine, 1));
  geo.setAttribute('aFlex', new THREE.BufferAttribute(flex, 1));
  geo.computeVertexNormals();
  return geo;
}

function finGrid(rows, cols, fn) {
  const pos = [], idx = [];
  for (let i = 0; i < rows; i++) {
    const u = i / (rows - 1);
    for (let j = 0; j < cols; j++) {
      const v = j / (cols - 1);
      const p = fn(u, v);
      pos.push(p[0], p[1], p[2]);
    }
  }
  for (let i = 0; i < rows - 1; i++) {
    for (let j = 0; j < cols - 1; j++) {
      const a = i * cols + j;
      const b = a + 1;
      const c = a + cols;
      const d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  const U = new Float32Array(rows * cols), V = new Float32Array(rows * cols);
  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < cols; j++) {
      const k = i * cols + j;
      U[k] = i / (rows - 1);
      V[k] = j / (cols - 1);
    }
  }
  geo.setAttribute('aU', new THREE.BufferAttribute(U, 1));
  geo.setAttribute('aV', new THREE.BufferAttribute(V, 1));
  geo.computeVertexNormals();
  return geo;
}

function vertexColorize(geo, fn) {
  const pos = geo.attributes.position;
  const arr = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const c = fn(x, y, z, i);
    arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
}

function fishMaterial(roughness, metalness, transparent = false, opacity = 1) {
  return new THREE.MeshStandardMaterial({
    vertexColors: true, roughness, metalness,
    transparent, opacity, side: THREE.DoubleSide,
  });
}
function addFinMesh(group, geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  group.add(m);
  return m;
}

/* ---------- 1. Fancy guppy ---------- */
function buildGuppy() {
  const G = new THREE.Group();
  const L = 0.85;

  const body = bodyCylinder(L, u => {
    if (u < 0.12) return 0.05 + u / 0.12 * 0.035;
    if (u < 0.5) return 0.085 - (u - 0.12) * 0.04;
    if (u < 0.78) return 0.07 - (u - 0.5) * 0.09;
    return Math.max(0.01, 0.033 - (u - 0.78) * 0.2);
  }, 22, 12);
  vertexColorize(body, (x, y, z, i) => {
    const u = (z + L / 2) / L;
    const base = new THREE.Color(0.62, 0.72, 0.86);
    if (u < 0.25) return base.multiplyScalar(1 + 0.15 * (0.25 - u));
    if (u < 0.6) {
      const t = (u - 0.25) / 0.35;
      return new THREE.Color().lerpColors(new THREE.Color(0.28, 0.72, 0.70), new THREE.Color(0.20, 0.55, 0.78), t);
    }
    return new THREE.Color(0.34, 0.62, 0.80);
  });
  const bodyMesh = addFinMesh(G, body, fishMaterial(0.32, 0.35));

  // fan tail
  const tail = finGrid(7, 9, (u, v) => {
    const w = 0.30 * Math.sin(u * Math.PI * 0.55);
    const x = (v - 0.5) * 2 * w;
    const y = (v - 0.5) * 2 * w * 0.55;
    const z = u * 0.34;
    return [x, y, z];
  });
  vertexColorize(tail, (x, y, z) => {
    const u = (z) / 0.34;
    const c = new THREE.Color(0.96, 0.42, 0.16);
    c.lerp(new THREE.Color(0.98, 0.62, 0.22), Math.max(0, 1 - u * 1.4));
    if (rand() < 0.08) c.set(0.12, 0.06, 0.03);
    c.lerp(new THREE.Color(0.9, 0.75, 0.4), (1 - u) * 0.3);
    return c;
  });
  const tailMesh = addFinMesh(G, tail, fishMaterial(0.45, 0.1));
  tailMesh.position.set(0, 0, L * 0.52);

  // dorsal
  const dorsal = finGrid(5, 5, (u, v) => {
    const x = (v - 0.5) * 2 * 0.09;
    const y = u * 0.2;
    const z = u * 0.28 - 0.02;
    return [x, y - 0.05, z];
  });
  vertexColorize(dorsal, () => new THREE.Color(0.88, 0.35, 0.14));
  const dorsalMesh = addFinMesh(G, dorsal, fishMaterial(0.45, 0.1));
  dorsalMesh.position.set(0, 0.05, -0.05);

  // pectorals + undersides
  const pecMeshes = [];
  const pec = (s) => {
    const g = new THREE.Group();
    const p = finGrid(3, 3, (u, v) => [s * (v - 0.5) * 0.14, u * 0.10, u * 0.06]);
    vertexColorize(p, () => new THREE.Color(0.3, 0.7, 0.72));
    const m = addFinMesh(g, p, fishMaterial(0.5, 0.1));
    m.rotation.z = s * 0.8;
    m.userData.baseRot = s * 0.8;
    g.position.set(s * 0.1, 0.01, -0.12);
    pecMeshes.push(m);
    return g;
  };
  G.add(pec(1), pec(-1));

  // eyes
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0a0c10, roughness: 0.1 });
  for (const s of [1, -1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), eyeMat);
    e.position.set(s * 0.055, 0.045, -0.32);
    G.add(e);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.006, 6, 5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    glint.position.set(s * 0.06, 0.052, -0.335);
    G.add(glint);
  }
  // gill arc
  const gill = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.004, 6, 14, 2.4), new THREE.MeshStandardMaterial({ color: 0x1a2a33, roughness: 0.6 }));
  gill.scale.set(1.3, 0.7, 0.3);
  gill.position.set(0, 0, -0.22);
  G.add(gill);
  // mouth
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 5), new THREE.MeshStandardMaterial({ color: 0x200f08, roughness: 0.5 }));
  mouth.position.set(0, 0.005, -0.43);
  G.add(mouth);

  return {
    group: G,
    body: { mesh: bodyMesh, attr: 'aSpine' },
    fins: [
      { mesh: tailMesh, amp: 1.0, frq: 7.0, mode: 'tail' },
      { mesh: dorsalMesh, amp: 0.7, frq: 8.0, mode: 'general' },
    ],
    pecMeshes,
  };
}

/* ---------- 2. Clownfish ---------- */
function buildClownfish() {
  const G = new THREE.Group();
  const L = 1.0;
  const body = bodyCylinder(L, u => {
    if (u < 0.16) return 0.055 + u / 0.16 * 0.10;
    if (u < 0.5) return 0.155 - (u - 0.16) * 0.05;
    if (u < 0.8) return 0.125 - (u - 0.5) * 0.14;
    return 0.045 - (u - 0.8) * 0.14;
  }, 24, 14);
  vertexColorize(body, (x, y, z) => {
    const u = (z + L / 2) / L;
    const c = new THREE.Color(0.95, 0.42, 0.16);
    const band = (b0, b1) => u > b0 && u < b1;
    if (band(0.12, 0.28) || band(0.40, 0.56) || band(0.70, 0.86)) {
      const edge = Math.min(Math.abs(u - 0.12), Math.abs(u - 0.28), Math.abs(u - 0.40), Math.abs(u - 0.56), Math.abs(u - 0.70), Math.abs(u - 0.86));
      if (edge < 0.03) return new THREE.Color(0.06, 0.05, 0.05);
      return new THREE.Color(0.95, 0.95, 0.92);
    }
    return c;
  });
  const bodyMesh = addFinMesh(G, body, fishMaterial(0.42, 0.08));

  // caudal
  const tail = finGrid(6, 7, (u, v) => {
    const w = 0.22 * Math.sin(u * Math.PI * 0.5);
    const x = (v - 0.5) * w * 2;
    const y = (v - 0.5) * w * 1.1;
    const z = u * 0.24;
    return [x, y, z];
  });
  vertexColorize(tail, (x, y, z) => {
    const c = new THREE.Color(0.95, 0.42, 0.16);
    if (rand() < 0.12) c.set(0.1, 0.08, 0.06);
    return c;
  });
  const tailMesh = addFinMesh(G, tail, fishMaterial(0.45, 0.1));
  tailMesh.position.set(0, 0, L * 0.52);

  // dorsal fin long
  const dorsal = finGrid(5, 5, (u, v) => {
    const x = (v - 0.5) * 0.35;
    const y = u * 0.3;
    const z = u * 0.6 - 0.1;
    return [x, y, z];
  });
  vertexColorize(dorsal, () => new THREE.Color(0.95, 0.45, 0.18));
  const dorsalMesh = addFinMesh(G, dorsal, fishMaterial(0.5, 0.05));
  dorsalMesh.position.set(0, 0.1, -0.18);

  // pectorals & anal
  const anal = finGrid(4, 4, (u, v) => {
    const x = (v - 0.5) * 0.24;
    const y = -u * 0.16;
    const z = u * 0.3 - 0.05;
    return [x, y, z];
  });
  vertexColorize(anal, () => new THREE.Color(0.9, 0.4, 0.16));
  addFinMesh(G, anal, fishMaterial(0.5, 0.05)).position.set(0, -0.06, -0.1);

  const pecMeshes = [];
  for (const s of [1, -1]) {
    const p = finGrid(3, 3, (u, v) => [s * (v - 0.5) * 0.16, u * 0.12, u * 0.07]);
    vertexColorize(p, () => new THREE.Color(0.95, 0.5, 0.2));
    const pm = addFinMesh(G, p, fishMaterial(0.5, 0.05));
    pm.rotation.z = s * 0.7;
    pm.userData.baseRot = s * 0.7;
    pm.position.set(s * 0.11, 0.01, -0.22);
    pecMeshes.push(pm);
  }

  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0a0c10, roughness: 0.1 });
  for (const s of [1, -1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 8), eyeMat);
    e.position.set(s * 0.07, 0.06, -0.4);
    G.add(e);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.007, 6, 5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    glint.position.set(s * 0.077, 0.07, -0.418);
    G.add(glint);
  }
  const gill = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.005, 6, 16, 2.4), new THREE.MeshStandardMaterial({ color: 0x1a2a33, roughness: 0.6 }));
  gill.scale.set(1.2, 0.8, 0.3);
  gill.position.set(0, 0, -0.3);
  G.add(gill);
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.016, 6, 5), new THREE.MeshStandardMaterial({ color: 0x200f08, roughness: 0.5 }));
  mouth.position.set(0, 0.01, -0.5);
  G.add(mouth);

  return {
    group: G,
    body: { mesh: bodyMesh },
    fins: [
      { mesh: tailMesh, amp: 0.85, frq: 5.5, mode: 'tail' },
      { mesh: dorsalMesh, amp: 0.7, frq: 7.0, mode: 'general' },
    ],
    pecMeshes,
  };
}

/* ---------- 3. Angelfish ---------- */
function buildAngelfish() {
  const G = new THREE.Group();
  const L = 0.95;
  const body = bodyCylinder(L, u => {
    const r = u < 0.2 ? 0.05 + u * 0.45 : 0.14 - (u - 0.2) * 0.12;
    return Math.max(0.02, r);
  }, 22, 14);
  // compress side profile for tall lateral body
  {
    const pos = body.attributes.position;
    for (let i = 0; i < pos.count; i++) pos.setY(i, pos.getY(i) * 1.65);
    body.computeVertexNormals();
  }
  vertexColorize(body, (x, y, z) => {
    const u = (z + L / 2) / L;
    const silver = new THREE.Color(0.78, 0.80, 0.85);
    const band = u > 0.18 && u < 0.3 || u > 0.42 && u < 0.55 || u > 0.66 && u < 0.8;
    if (band) return new THREE.Color(0.16, 0.20, 0.26);
    return silver;
  });
  const bodyMesh = addFinMesh(G, body, fishMaterial(0.3, 0.15));

  // dorsal huge triangular
  const dorsal = finGrid(9, 7, (u, v) => {
    const x = (v - 0.5) * 0.55 * Math.sin(u * Math.PI * 0.5);
    const y = u * 0.85;
    const z = u * 0.12 + (v - 0.5) * 0.02;
    return [x, y, z];
  });
  vertexColorize(dorsal, (x, y, z) => {
    const t = y / 0.85;
    return new THREE.Color().lerpColors(new THREE.Color(0.55, 0.58, 0.66), new THREE.Color(0.35, 0.38, 0.46), t);
  });
  const dorsalMesh = addFinMesh(G, dorsal, fishMaterial(0.35, 0.1));
  dorsalMesh.position.set(0, 0.12, -0.15);

  // anal mirror
  const anal = finGrid(9, 7, (u, v) => {
    const x = (v - 0.5) * 0.5 * Math.sin(u * Math.PI * 0.5);
    const y = -u * 0.75;
    const z = u * 0.12 + (v - 0.5) * 0.02;
    return [x, y, z];
  });
  vertexColorize(anal, (x, y, z) => {
    const t = -y / 0.75;
    return new THREE.Color().lerpColors(new THREE.Color(0.6, 0.62, 0.7), new THREE.Color(0.38, 0.4, 0.48), t);
  });
  const analMesh = addFinMesh(G, anal, fishMaterial(0.35, 0.1));
  analMesh.position.set(0, -0.12, -0.12);

  // pelvic filaments: 2 chains
  function chain(parent, x, y0) {
    const links = [];
    const n = 8;
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.008, 0.05, 4, 6), new THREE.MeshStandardMaterial({ color: 0x9aa2b0, roughness: 0.5 }));
      m.position.set(x, y0 - i * 0.055, -0.3 + i * 0.012);
      m.userData.bx = x;
      parent.add(m);
      links.push(m);
    }
    return links;
  }
  const leftChain = chain(G, -0.05, -0.1);
  const rightChain = chain(G, 0.05, -0.1);

  // pectorals
  const pecMeshes = [];
  for (const s of [1, -1]) {
    const p = finGrid(3, 3, (u, v) => [s * (v - 0.5) * 0.12, u * 0.08, u * 0.05]);
    vertexColorize(p, () => new THREE.Color(0.72, 0.75, 0.82));
    const pm = addFinMesh(G, p, fishMaterial(0.4, 0.12));
    pm.rotation.z = s * 0.6;
    pm.userData.baseRot = s * 0.6;
    pm.position.set(s * 0.08, 0.01, -0.2);
    pecMeshes.push(pm);
  }

  // tail modest
  const tail = finGrid(5, 5, (u, v) => {
    const w = 0.13 * (1 - u * 0.3);
    const x = (v - 0.5) * w * 2;
    const y = (v - 0.5) * w * 0.8;
    return [x, y, u * 0.16];
  });
  vertexColorize(tail, () => new THREE.Color(0.7, 0.73, 0.8));
  const tailMesh = addFinMesh(G, tail, fishMaterial(0.35, 0.12));
  tailMesh.position.set(0, 0, L * 0.5);

  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0a0c10, roughness: 0.1 });
  for (const s of [1, -1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.024, 10, 8), eyeMat);
    e.position.set(s * 0.045, 0.05, -0.44);
    G.add(e);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.006, 6, 5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    glint.position.set(s * 0.05, 0.058, -0.456);
    G.add(glint);
  }
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 5), new THREE.MeshStandardMaterial({ color: 0x241610, roughness: 0.5 }));
  mouth.position.set(0, 0.005, -0.48);
  G.add(mouth);

  return {
    group: G,
    body: { mesh: bodyMesh },
    fins: [
      { mesh: dorsalMesh, amp: 0.5, frq: 4.0, mode: 'general' },
      { mesh: analMesh, amp: 0.5, frq: 4.0, mode: 'general' },
      { mesh: tailMesh, amp: 0.7, frq: 6.0, mode: 'tail' },
    ],
    chains: [leftChain, rightChain],
    pecMeshes,
  };
}

/* ---------- 4. Betta ---------- */
function buildBetta() {
  const G = new THREE.Group();
  const L = 1.15;
  const body = bodyCylinder(L, u => {
    if (u < 0.15) return 0.045 + u / 0.15 * 0.075;
    if (u < 0.55) return 0.12 - (u - 0.15) * 0.04;
    return 0.095 - (u - 0.55) * 0.13;
  }, 24, 13);
  vertexColorize(body, (x, y, z) => {
    const u = (z + L / 2) / L;
    const c = new THREE.Color(0.15, 0.16, 0.55);
    if (u < 0.3) c.lerp(new THREE.Color(0.1, 0.55, 0.62), (0.3 - u) / 0.3 * 0.75);
    else c.lerp(new THREE.Color(0.4, 0.12, 0.55), (u - 0.3) * 1.1);
    return c;
  });
  const bodyMesh = addFinMesh(G, body, fishMaterial(0.35, 0.12));

  // large flowing caudal
  const tail = finGrid(14, 14, (u, v) => {
    const base = 0.16;
    const r = base + u * 0.75;
    const a = (v - 0.5) * Math.PI * 1.05;
    const scallop = 1 + 0.09 * Math.sin(v * 14.0);
    const x = Math.sin(a) * r * scallop;
    const y = Math.cos(a) * r * 0.82 * scallop;
    const z = u * 0.42;
    return [x, y, z];
  });
  vertexColorize(tail, (x, y, z) => {
    const u = z / 0.42;
    const t = Math.min(1, u * 1.6);
    const c = new THREE.Color().lerpColors(new THREE.Color(0.12, 0.2, 0.75), new THREE.Color(0.72, 0.18, 0.5), t);
    if (rand() < 0.05) c.offsetHSL(0, 0.1, -0.2);
    return c;
  });
  const tailMesh = addFinMesh(G, tail, fishMaterial(0.4, 0.08));
  tailMesh.position.set(0, 0, L * 0.52);

  // dorsal
  const dorsal = finGrid(10, 9, (u, v) => {
    const x = (v - 0.5) * 0.44 * (1 - u * 0.4);
    const y = u * 0.52 + Math.sin(v * 9.0) * 0.03 * u;
    const z = u * 0.4 - 0.1;
    return [x, y, z];
  });
  vertexColorize(dorsal, (x, y, z) => {
    const u = z / 0.4 + 0.25;
    const c = new THREE.Color().lerpColors(new THREE.Color(0.14, 0.2, 0.7), new THREE.Color(0.65, 0.16, 0.48), u);
    return c;
  });
  const dorsalMesh = addFinMesh(G, dorsal, fishMaterial(0.4, 0.08));
  dorsalMesh.position.set(0, 0.06, -0.22);

  // anal
  const anal = finGrid(10, 9, (u, v) => {
    const x = (v - 0.5) * 0.4 * (1 - u * 0.4);
    const y = -u * 0.48 + Math.sin(v * 9.0 + 1.0) * 0.03 * u;
    const z = u * 0.4 - 0.1;
    return [x, y, z];
  });
  vertexColorize(anal, (x, y, z) => {
    const u = z / 0.4 + 0.25;
    const c = new THREE.Color().lerpColors(new THREE.Color(0.16, 0.22, 0.72), new THREE.Color(0.62, 0.15, 0.5), u);
    return c;
  });
  const analMesh = addFinMesh(G, anal, fishMaterial(0.4, 0.08));
  analMesh.position.set(0, -0.07, -0.22);

  // pectorals
  const pecMeshes = [];
  for (const s of [1, -1]) {
    const p = finGrid(3, 3, (u, v) => [s * (v - 0.5) * 0.1, u * 0.1, u * 0.06]);
    vertexColorize(p, () => new THREE.Color(0.1, 0.5, 0.55));
    const pm = addFinMesh(G, p, fishMaterial(0.45, 0.08));
    pm.rotation.z = s * 0.7;
    pm.userData.baseRot = s * 0.7;
    pm.position.set(s * 0.09, 0.01, -0.25);
    pecMeshes.push(pm);
  }

  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0a0c10, roughness: 0.1 });
  for (const s of [1, -1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.026, 10, 8), eyeMat);
    e.position.set(s * 0.06, 0.05, -0.5);
    G.add(e);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.007, 6, 5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    glint.position.set(s * 0.067, 0.058, -0.518);
    G.add(glint);
  }
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.014, 6, 5), new THREE.MeshStandardMaterial({ color: 0x200f08, roughness: 0.5 }));
  mouth.position.set(0, 0.008, -0.58);
  G.add(mouth);

  return {
    group: G,
    body: { mesh: bodyMesh },
    fins: [
      { mesh: tailMesh, amp: 1.0, frq: 5.0, mode: 'flow' },
      { mesh: dorsalMesh, amp: 0.8, frq: 6.0, mode: 'flow' },
      { mesh: analMesh, amp: 0.8, frq: 6.0, mode: 'flow' },
    ],
    pecMeshes,
  };
}
