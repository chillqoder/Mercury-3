      burstT: 0, speed: 0.8, effort: 0.6,
      phase: rand() * 10,
      turn: 0, bank: 0,
      cfg: s,
    };
    group.position.copy(st.pos);
    group.quaternion.copy(st.q);
    group.userData.fish = st;
    scene.add(group);
    // stash base arrays
    const baseBody = Float32Array.from(model.body.mesh.geometry.attributes.position.array);
    const baseFins = model.fins.map(f => Float32Array.from(f.mesh.geometry.attributes.position.array));
    fishes.push({ model, st, baseBody, baseFins, obAvoid: new THREE.Vector3() });
  }
}

function pickTarget(f) {
  const st = f.st, cfg = st.cfg;
  const m = 0.9;
  st.target.set(
    rrange(-TANK.w / 2 + m, TANK.w / 2 - m),
    rrange(cfg.y[0], cfg.y[1]),
    rrange(-TANK.d / 2 + m, TANK.d / 2 - m)
  );
}

function updateFish(dt) {
  for (const f of fishes) {
    const st = f.st, cfg = st.cfg;
    // hover / burst pattern
    if (st.hoverT > 0) {
      st.hoverT -= dt;
      st.speed = 0.15;
      st.effort = 0.25;
      if (st.hoverT <= 0) {
        st.burstT = rrange(cfg.burst[0], cfg.burst[1]);
        pickTarget(f);
      }
    } else {
      st.burstT -= dt;
      const distT = st.pos.distanceTo(st.target);
      if (st.burstT <= 0 || distT < 0.5) {
        st.hoverT = rrange(cfg.hover[0], cfg.hover[1]);
      }
      st.speed = rrange(cfg.spd[0], cfg.spd[1]);
      st.effort = clamp((distT - 0.5) * 0.85, 0.3, 1.0);
    }

    // steering toward target
    const toT = new THREE.Vector3().subVectors(st.target, st.pos).normalize();
    st.vel.lerp(toT, 1 - Math.exp(-dt * 1.1));
    st.vel.setLength(st.speed);

    // wall + boundary avoidance
    const m = 0.6;
    const minX = -TANK.w / 2 + m, maxX = TANK.w / 2 - m;
    const minZ = -TANK.d / 2 + m, maxZ = TANK.d / 2 - m;
    if (st.pos.x < minX) { st.vel.x += (minX - st.pos.x) * 2.2; }
    if (st.pos.x > maxX) { st.vel.x -= (st.pos.x - maxX) * 2.2; }
    if (st.pos.z < minZ) { st.vel.z += (minZ - st.pos.z) * 2.2; }
    if (st.pos.z > maxZ) { st.vel.z -= (st.pos.z - maxZ) * 2.2; }
    const yMin = cfg.y[0] - 0.15, yMax = cfg.y[1] + 0.15;
    if (st.pos.y < yMin) { st.vel.y += (yMin - st.pos.y) * 3.0; }
    if (st.pos.y > yMax) { st.vel.y -= (st.pos.y - yMax) * 3.0; }

    // obstacle field targeting
    for (const ob of castleObstacles) {
      const cx = (ob.min[0] + ob.max[0]) / 2;
      const cy = (ob.min[1] + ob.max[1]) / 2;
      const cz = (ob.min[2] + ob.max[2]) / 2;
      const hw = (ob.max[0] - ob.min[0]) / 2 + 0.45;
      const hh = (ob.max[1] - ob.min[1]) / 2 + 0.45;
      const hd = (ob.max[2] - ob.min[2]) / 2 + 0.45;
      const dx = st.pos.x - cx, dy = st.pos.y - cy, dz = st.pos.z - cz;
      const ox = Math.max(0, Math.abs(dx) - hw);
      const oy = Math.max(0, Math.abs(dy) - hh);
      const oz = Math.max(0, Math.abs(dz) - hd);
      const d2 = ox * ox + oy * oy + oz * oz;
      if (d2 < 0.7 * 0.7) {
        const push = 1 / Math.max(d2, 0.06);
        st.vel.x += Math.sign(dx) * push * 1.2;
        st.vel.y += Math.sign(dy) * push * 0.4;
        st.vel.z += Math.sign(dz) * push * 1.2;
      }
    }

    // separation
    for (const other of fishes) {
      if (other === f) continue;
      const d = st.pos.distanceTo(other.st.pos);
      if (d < 0.9 && d > 0.0001) {
        const push = (0.9 - d) / 0.9;
        const inv = new THREE.Vector3().subVectors(st.pos, other.st.pos).normalize();
        st.vel.addScaledVector(inv, push * 1.3);
      }
    }

    st.vel.setLength(clamp(st.vel.length(), 0, cfg.spd[1] * 1.3));
    st.pos.addScaledVector(st.vel, dt);
    st.pos.x = clamp(st.pos.x, minX - 0.25, maxX + 0.25);
    st.pos.y = clamp(st.pos.y, cfg.y[0] - 0.4, cfg.y[1] + 0.4);
    st.pos.z = clamp(st.pos.z, minZ - 0.25, maxZ + 0.25);

    // orientation
    const dir = st.vel.clone().normalize();
    // fish models point their head down local -Z, so the yaw is measured for -Z
    const yaw = Math.atan2(-dir.x, -dir.z);
    const pitch = Math.asin(clamp(dir.y, -1, 1));
    const lateral = Math.sin(yaw) * st.vel.x - Math.cos(yaw) * st.vel.z;
    st.bank = clamp(-lateral * 0.9, -0.5, 0.5);
    const qTarget = new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch, yaw, st.bank, 'YXZ'));
    st.q.slerp(qTarget, 1 - Math.exp(-dt * 4.0));
    f.model.group.quaternion.copy(st.q);
    f.model.group.position.copy(st.pos);

    // deformation
    deformFish(f, dt);

    // pectoral flutters
    if (f.model.pecMeshes) {
      for (const pm of f.model.pecMeshes) {
        pm.rotation.x = Math.sin(simTime * 10.0 + f.st.phase) * 0.12;
        pm.rotation.z = pm.userData.baseRot + Math.sin(simTime * 7.0 + f.st.phase) * 0.10;
      }
    }
  }
}

function deformFish(f, dt) {
  const t = simTime;
  const effort = f.st.effort;
  const m = f.model;

  // body
  const bPos = m.body.mesh.geometry.attributes.position;
  const bSpine = m.body.mesh.geometry.attributes.aSpine;
  const bFlex = m.body.mesh.geometry.attributes.aFlex;
  const bBase = f.baseBody;
  {
    const arr = bPos.array;
    const amp = (0.04 + 0.10 * effort);
    const frq = 6.0 + effort * 4.0;
    for (let i = 0; i < bPos.count; i++) {
      const u = bSpine.getX(i);
      const flex = bFlex.getX(i);
      const w = Math.sin(t * frq - u * (7.0 + effort * 5.0) + f.st.phase) * amp * flex;
      arr[i * 3] = bBase[i * 3] + w;
      arr[i * 3 + 1] = bBase[i * 3 + 1] + w * 0.22;
    }
    bPos.needsUpdate = true;
    m.body.mesh.geometry.computeVertexNormals();
  }

  // fins
  m.fins.forEach((fin, fi) => {
    const pos = fin.mesh.geometry.attributes.position;
    const U = fin.mesh.geometry.attributes.aU;
    const V = fin.mesh.geometry.attributes.aV;
    const base = f.baseFins[fi];
    const arr = pos.array;
    const a = fin.amp * (0.25 + effort * 0.9);
    const frq = fin.frq;
    for (let i = 0; i < pos.count; i++) {
      const u = U.getX(i), v = V.getX(i);
      const flex = Math.pow(u, 1.7);
      let sway;
      if (fin.mode === 'tail') {
        sway = Math.sin(t * frq - u * 8.0 + v * 2.2 + f.st.phase) * a * flex;
      } else if (fin.mode === 'flow') {
        sway = Math.sin(t * frq * 0.8 - u * 5.0 + v * 4.0 + f.st.phase) * a * flex * (0.7 + 0.5 * Math.sin(v * Math.PI));
      } else {
        sway = Math.sin(t * frq * 0.7 - u * 4.0 + v * 3.0 + f.st.phase) * a * flex;
      }
      arr[i * 3] = base[i * 3] + sway * 0.6;
      arr[i * 3 + 1] = base[i * 3 + 1] + sway * 0.4;
      arr[i * 3 + 2] = base[i * 3 + 2] + sway * 0.5;
    }
    pos.needsUpdate = true;
    fin.mesh.geometry.computeVertexNormals();
  });

  // angelfish pelvic chains
  if (m.chains) {
    for (const chain of m.chains) {
      const sway = Math.sin(t * 2.2 + f.st.phase + chain[0].position.x * 3.0) * 0.02;
      chain.forEach((l, li) => {
        const tx = l.userData.bx + sway * (li / chain.length);
        l.position.x += (tx - l.position.x) * (1 - Math.exp(-dt * 8.0));
      });
    }
  }
}

/* ================= STAGE 12: CRAB ================= */

/* ---------- crab ---------- */
const crab = {
  group: null,
  legs: [],
  claws: [],
  body: null,
  heading: 0, pos: new THREE.Vector3(-2.6, 0, 1.2),
  speed: 0.28, t: 0, pauseT: 0, dirSign: 1,
  stepDur: 0.6, stepPhase: 0, stride: 0.24, lift: 0.12,
  build() {
    const G = new THREE.Group();
    this.group = G;
    const shellMat = new THREE.MeshStandardMaterial({ color: 0x8a3b22, roughness: 0.55, metalness: 0.05 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x3c1d12, roughness: 0.8 });

    // carapace
    const car = new THREE.Mesh(new THREE.IcosahedronGeometry(0.34, 1), shellMat);
    car.scale.set(1.15, 0.62, 0.95);
    car.position.y = 0.18;
    G.add(car);
    this.body = car;
    // segmentation ridges
    for (let i = 0; i < 4; i++) {
      const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.03, 0.04), darkMat);
      ridge.position.set(Math.sin(i * 1.7) * 0.1, 0.26 + i * 0.035, -0.15 + i * 0.1);
      ridge.rotation.y = i * 0.5;
      G.add(ridge);
    }
    // eyes
    for (const s of [1, -1]) {
      const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.024, 0.11, 8), shellMat);
      stalk.position.set(s * 0.16, 0.36, -0.22);
      G.add(stalk);
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshStandardMaterial({ color: 0x0a0a08, roughness: 0.2 }));
      eye.position.set(s * 0.16, 0.44, -0.24);
      G.add(eye);
    }
    // mouthparts
    for (let i = 0; i < 3; i++) {
      const mp = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.06), darkMat);
      mp.position.set(0, 0.08, -0.34 + i * 0.035);
      G.add(mp);
    }

    // legs
    const legConfigs = [];
    for (let i = 0; i < 4; i++) {
      const side = (i % 2 === 0) ? 1 : -1;
      const back = Math.floor(i / 2);
      const xOff = 0.22 - back * 0.02;
      const zOff = -0.12 + back * 0.14;
      const reach = 0.38 - back * 0.02;
      legConfigs.push({ side, xOff, zOff, reach, phaseOff: (i / 4) * 0.5 });
    }
    for (const cfg of legConfigs) {
      const leg = { cfg, cur: new THREE.Vector3(), next: new THREE.Vector3(), lift: 0, planted: true };
      // upper
      const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.028, 0.3, 7), shellMat);
      upper.position.y = 0.16;
      const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.02, 0.27, 7), shellMat);
      lower.position.y = -0.14;
      const foot = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.05, 6), darkMat);
      foot.position.y = -0.28;
      foot.rotation.x = Math.PI;
      const legG = new THREE.Group();
      legG.add(upper, lower, foot);
      leg.upper = upper; leg.lower = lower; leg.foot = foot; leg.group = legG;
      legG.position.set(cfg.xOff * cfg.side, 0.14, cfg.zOff);
      G.add(legG);
      this.legs.push(leg);
    }

    // claws
    for (const s of [1, -1]) {
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.032, 0.3, 8), shellMat);
      arm.position.set(s * 0.2, 0.14, -0.26);
      arm.rotation.z = -s * 0.7;
      const clawRoot = new THREE.Group();
      clawRoot.position.set(s * 0.2, 0.14, -0.26);
      const claw = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), shellMat);
      claw.scale.set(1.4, 0.7, 0.9);
      clawRoot.add(claw);
      const p1 = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.12, 6), shellMat);
      p1.position.set(s * 0.05, 0.02, -0.08); p1.rotation.x = -1.2;
      const p2 = p1.clone(); p2.position.set(-s * 0.05, 0.02, -0.08); p2.rotation.x = -1.2;
      clawRoot.add(p1, p2);
      G.add(arm, clawRoot);
      this.claws.push({ group: clawRoot, p1, p2, openness: rrange(0.3, 0.8) });
    }

    scene.add(G);
    this.place();
  },
  // model front is local -Z, so the group yaw is heading + PI
  toWorld(lx, lz) {
    const th = this.heading + Math.PI;
    const s = Math.sin(th), c = Math.cos(th);
    return new THREE.Vector3(this.pos.x + lx * c + lz * s, 0, this.pos.z - lx * s + lz * c);
  },
  toLocal(wx, wz) {
    const th = this.heading + Math.PI;
    const s = Math.sin(th), c = Math.cos(th);
    const dx = wx - this.pos.x, dz = wz - this.pos.z;
    return { x: dx * c - dz * s, z: dx * s + dz * c };
  },
  // rest point of a foot on the ground, shifted `fwd` units toward the crab's front
  footWorld(leg, fwd) {
    const c = leg.cfg;
    const w = this.toWorld(c.side * (Math.abs(c.xOff) + c.reach * 0.9), c.zOff - fwd);
    w.y = groundHeightAt(w.x, w.z) + 0.02;
    return w;
  },
  place() {
    this.group.position.set(this.pos.x, groundHeightAt(this.pos.x, this.pos.z) + 0.13, this.pos.z);
    this.group.rotation.y = this.heading + Math.PI;
    this.wanderH = this.heading;
    for (const leg of this.legs) {
      const w = this.footWorld(leg, 0);
      leg.cur = w.clone(); leg.next = w.clone(); leg.from = w.clone(); leg.swinging = false;
      this.placeFoot(leg, w);
    }
  },
  // two-bone IK in the leg's own frame: hip at leg.group origin, knee raised toward the sky
  placeFoot(leg, w) {
    const root = leg.group.position;
    const l = this.toLocal(w.x, w.z);
    const f = new THREE.Vector3(l.x - root.x, w.y - this.group.position.y - root.y, l.z - root.z);
    const l1 = 0.3, l2 = 0.27;
    const d = clamp(f.length(), 0.05, l1 + l2 - 0.01);
    const fd = f.clone().normalize();
    const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
    const up = new THREE.Vector3(0, 1, 0);
    const perp = up.clone().addScaledVector(fd, -up.dot(fd));
    if (perp.lengthSq() < 1e-6) perp.set(1, 0, 0);
    perp.normalize();
    const knee = fd.clone().multiplyScalar(l1 * Math.cos(a)).addScaledVector(perp, l1 * Math.sin(a));
    const foot = fd.clone().multiplyScalar(d);
    const lowerDir = foot.clone().sub(knee).normalize();
    leg.upper.position.copy(knee).multiplyScalar(0.5);
    leg.upper.quaternion.setFromUnitVectors(up, knee.clone().normalize());
    leg.lower.position.copy(knee).add(foot).multiplyScalar(0.5);
    leg.lower.quaternion.setFromUnitVectors(up, lowerDir);
    leg.foot.position.copy(foot).addScaledVector(lowerDir, 0.02);
    leg.foot.quaternion.setFromUnitVectors(up, lowerDir);
  },
  // wander, but turn back toward the middle near the edges and away from the castle
  steer(dt) {
    const castle = { x: -0.55, z: -0.35 };
    const edge = Math.min(this.pos.x + 3.2, 3.2 - this.pos.x, this.pos.z + 1.5, 1.55 - this.pos.z);
    let want;
    if (edge < 0.6) {
      want = Math.atan2(-this.pos.x, -this.pos.z);
      this.wanderH = this.heading;
    } else if (Math.hypot(this.pos.x - castle.x, this.pos.z - castle.z) < 1.9) {
      want = Math.atan2(this.pos.x - castle.x, this.pos.z - castle.z);
      this.wanderH = this.heading;
    } else {
      this.wanderH += (rand() - 0.5) * dt * 1.2;
      want = this.wanderH;
    }
    const diff = Math.atan2(Math.sin(want - this.heading), Math.cos(want - this.heading));
    this.heading += clamp(diff, -1, 1) * dt * 1.2;
  },
  update(dt) {
    if (this.pauseT > 0) {
      this.pauseT -= dt;
    } else {
      this.steer(dt);
      if (rand() < dt * 0.14) {
        this.pauseT = rrange(0.8, 2.4);
        for (const cl of this.claws) cl.openness = rrange(0.25, 1.0);
      }
    }
    const walking = this.pauseT <= 0;
    if (walking) {
      this.pos.x = clamp(this.pos.x + Math.sin(this.heading) * this.speed * dt, -3.2, 3.2);
      this.pos.z = clamp(this.pos.z + Math.cos(this.heading) * this.speed * dt, -1.5, 1.55);
      this.stepPhase += dt / this.stepDur;
    }

    // body follows the ground
    const gy = groundHeightAt(this.pos.x, this.pos.z);
    this.group.position.set(this.pos.x, gy + 0.13, this.pos.z);
    this.group.rotation.y = this.heading + Math.PI;

    // planted feet stay put in the world; a swinging foot lifts and lands ahead of its rest point
    for (const leg of this.legs) {
      const ph = (this.stepPhase + leg.cfg.phaseOff) % 1;
      const swinging = walking && ph < 0.5;
      if (swinging && !leg.swinging) leg.from.copy(leg.cur);
      if (!swinging && leg.swinging) leg.cur.copy(leg.next);
      leg.swinging = swinging;
      if (swinging) {
        const t = ph / 0.5;
        leg.next.copy(this.footWorld(leg, this.stride * 0.5));
        const p = leg.from.clone().lerp(leg.next, t);
        p.y += Math.sin(t * Math.PI) * this.lift;
        this.placeFoot(leg, p);
      } else {
        this.placeFoot(leg, leg.cur);
      }
    }

    // claws anim
    for (const cl of this.claws) {
      const o = cl.openness + Math.sin(simTime * 1.2 + cl.p1.position.x * 5) * 0.05;
      cl.p1.rotation.z = -o * 0.5;
      cl.p2.rotation.z = o * 0.5;
    }
  },
};

/* ================= STAGE 13: SNAILS ================= */

/* ---------- snails ---------- */
function makeSnailShell(mat, bands) {
  const turns = 3.4;
  const seg = 64;
  const ringSeg = 8;
  const pos = [];
  const colors = [];
  const idx = [];
  let prevRing = null;
  for (let i = 0; i <= seg; i++) {
    const t = i / seg;
    const R = 0.17 * (1 - t * 0.82);
    const H = t * 0.22;
    const ang = t * turns * Math.PI * 2;
    const cx = Math.cos(ang) * R;
    const cz = Math.sin(ang) * R;
    const cy = H;
    const rad = 0.04 * (1 - t * 0.55);
    const ring = [];
    for (let j = 0; j < ringSeg; j++) {
      const a = (j / ringSeg) * Math.PI * 2;
      const nx = cx + Math.cos(a) * rad;
      const ny = cy + Math.sin(a) * rad * 0.85;
      const nz = cz + Math.sin(a) * rad;
      pos.push(nx, ny, nz);
      const band = bands(Math.sin(t * 40.0) * 0.5 + 0.5, t);
      colors.push(band.r, band.g, band.b);
      ring.push(pos.length / 3 - 1);
    }
    if (prevRing) {
      for (let j = 0; j < ringSeg; j++) {
        const j2 = (j + 1) % ringSeg;
        idx.push(prevRing[j], ring[j], ring[j2], prevRing[j], ring[j2], prevRing[j2]);
      }
    }
    prevRing = ring;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  return mesh;
}

const snails = [];

function buildSnail({ onGlass, start, seed }) {
  const G = new THREE.Group();
  const shellMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.45, metalness: 0.05 });
  const bodyMat = new THREE.MeshStandardMaterial({ color: onGlass ? 0xc9b47a : 0xb08a5e, roughness: 0.65 });

  // shell
  const shell = makeSnailShell(shellMat, (band, t) => {
    const base = onGlass
      ? new THREE.Color(0.82, 0.78, 0.60)
      : new THREE.Color(0.72, 0.48, 0.24);
    if (band > 0.55) base.offsetHSL(0, 0.05, -0.12);
    if (Math.random() < 0.05) base.offsetHSL(0, 0, 0.25);
    return base;
  });
  // shell stands on the back of the body, apex up; its base ring overlaps the body top
  shell.position.set(0, 0.13, 0.02);
  G.add(shell);

  // soft body
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.22, 5, 8), bodyMat);
  body.position.set(0, 0.04, 0.24);
  body.rotation.x = Math.PI / 2;
  G.add(body);

  // head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), bodyMat);
  head.position.set(0, 0.06, 0.38);
  G.add(head);
  for (const s of [1, -1]) {
    const tent = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.009, 0.14, 6), bodyMat);
    tent.position.set(s * 0.04, 0.13, 0.36);
    tent.rotation.z = -s * 0.35;
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 5), new THREE.MeshStandardMaterial({ color: 0x141210, roughness: 0.3 }));
    tip.position.set(s * 0.05, 0.2, 0.36);
    G.add(tent, tip);
  }

  const snail = { group: G, shell, onGlass, t0: seed * 11, pause: 0, tentPhase: 0 };
  G.position.copy(start);
  if (onGlass) {
    G.rotation.x = -Math.PI / 2; // local +Y (shell) points inward (-Z), local +Z crawls up the pane
    // foot sole sits about 0.035 below the group origin, so this puts it on the inner glass face
    G.position.z = TANK.d / 2 - 0.035;
  } else {
    G.rotation.y = seed * 6 - 3;
    G.position.y = groundHeightAt(start.x, start.z) + 0.035;
  }
  scene.add(G);
  snails.push(snail);
  return snail;
}

function buildSnails() {
  buildSnail({ onGlass: false, start: new THREE.Vector3(2.4, 0, 1.15), seed: 0.3 });
  buildSnail({ onGlass: true, start: new THREE.Vector3(1.55, 1.75, 0), seed: 0.8 });
}

function updateSnails(dt) {
  for (const s of snails) {
    s.tentPhase += dt * 1.4;
    const headIdx = 3, tent0 = 4, tent1 = 6;
    if (s.group.children[headIdx]) {
      s.group.children[headIdx].rotation.y = Math.sin(s.tentPhase) * 0.18;
    }
    if (s.onGlass) {
      // dawdle along a short path on the pane
      const a = Math.sin(simTime * 0.05 + s.t0) * 0.55;
      const y = 1.75 + a * 0.5;
      const x = 1.55 + Math.cos(simTime * 0.035 + s.t0 * 2) * 0.35;
      s.group.position.set(x, y, TANK.d / 2 - 0.035);
      s.group.rotation.set(-Math.PI / 2, 0, Math.sin(simTime * 0.08 + s.t0) * 0.15);
    } else {
      const cx = Math.sin(simTime * 0.045 + s.t0) * 2.35;
      const cz = 1.0 + Math.sin(simTime * 0.03 + s.t0 * 1.7) * 0.5;
      const gy = groundHeightAt(cx, cz);
      s.group.position.set(cx, gy + 0.035, cz);
      // face the direction of travel: the path's derivative (body points along +Z)
      s.group.rotation.y = Math.atan2(
        Math.cos(simTime * 0.045 + s.t0) * 2.35 * 0.045,
        Math.cos(simTime * 0.03 + s.t0 * 1.7) * 0.55 * 0.03
      );
      s.group.scale.setScalar(1 + Math.sin(simTime * 0.7 + s.t0 * 3) * 0.015);
    }
  }
}

/* ================= STAGE 14: LIGHTING / CAUSTICS / PARTICLES ================= */

/* ---------- caustics & suspended particles ---------- */
let causticMesh = null;
function buildCaustics() {
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 },
      uStrength: { value: 0.30 },
      uColor: { value: new THREE.Color(0.34, 0.55, 0.60) },
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main(){
        vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: CAUSTIC_GLSL + `
      varying vec3 vWorldPos;
      uniform float uTime;
      uniform float uStrength;
      uniform vec3 uColor;
      void main(){
        float ca = causticIntensity(vWorldPos.xz, uTime);
        float edgeX = smoothstep(0.0, 0.6, min(vWorldPos.x + 4.0, 4.0 - vWorldPos.x));
        float edgeZ = smoothstep(0.0, 0.6, min(vWorldPos.z + 2.0, 2.0 - vWorldPos.z));
        float mask = edgeX * edgeZ;
        float v = ca * ca * 0.85;
        gl_FragColor = vec4(uColor * v * uStrength, v * mask);
      }`,
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(TANK.w - 0.2, TANK.d - 0.2, 1, 1), mat);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = 0.075;
  plane.renderOrder = 24;
  plane.userData.excludeFromRefraction = true;
  refractionHidden.push(plane);
  scene.add(plane);
  causticMesh = plane;
  return mat;
}

const particleSys = {
  points: null,
  count: 140,
  build() {
    const pos = new Float32Array(this.count * 3);
    const seed = new Float32Array(this.count);
    for (let i = 0; i < this.count; i++) {
      const x = rrange(-TANK.w / 2 + 0.5, TANK.w / 2 - 0.5);
      const z = rrange(-TANK.d / 2 + 0.5, TANK.d / 2 - 0.5);
      const y = rrange(0.3, TANK.waterY - 0.3);
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      seed[i] = rand() * 100;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
    // soft sprite texture
    const cv = document.createElement('canvas');
    cv.width = cv.height = 32;
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(16, 16, 1, 16, 16, 15);
    g.addColorStop(0, 'rgba(255,255,255,0.55)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.15)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 32, 32);
    const mat = new THREE.PointsMaterial({
      map: new THREE.CanvasTexture(cv),
      size: 0.05, transparent: true, opacity: 0.55,
      depthWrite: false, color: 0xd9e6ee, sizeAttenuation: true,
    });
    this.points = new THREE.Points(geo, mat);
    this.points.renderOrder = 27;
    // particles stay in the refraction capture for the same reason as bubbles
    scene.add(this.points);
  },
  update(dt) {
    const pos = this.points.geometry.attributes.position;
    const seed = this.points.geometry.attributes.aSeed;
    const arr = pos.array;
    for (let i = 0; i < this.count; i++) {
      const x = arr[i * 3], y = arr[i * 3 + 1], z = arr[i * 3 + 2];
      const cu = currentAt(x, y, z);
      const s = seed.getX(i);
      arr[i * 3] = x + cu.x * dt * 0.6 + Math.sin(simTime * 0.5 + s) * 0.002;
      arr[i * 3 + 1] = y + cu.y * dt * 0.4 + Math.sin(simTime * 0.7 + s * 1.3) * 0.002;
      arr[i * 3 + 2] = z + cu.z * dt * 0.6 + Math.cos(simTime * 0.45 + s * 0.8) * 0.002;
      if (arr[i * 3 + 1] > TANK.waterY - 0.2) arr[i * 3 + 1] = 0.3;
      if (arr[i * 3 + 1] < 0.25) arr[i * 3 + 1] = TANK.waterY - 0.25;
    }
    pos.needsUpdate = true;
  },
};

/* ================= STAGE 15-16: UI, LOOP, RESIZE ================= */

/* ---------- main loop & presentation ---------- */
let simTime = 0;
let paused = false;
const btnPause = document.getElementById('btnPause');
const btnReset = document.getElementById('btnReset');
const clock = new THREE.Clock();

function enforceCameraBounds() {
  const t = controls.target;
  const r = Math.hypot(t.x, t.z);
  const maxR = 4.9;
  if (r > maxR) {
    const k = maxR / r;
    t.x *= k; t.z *= k;
  }
  t.y = clamp(t.y, 1.25, 3.75);
  controls.target.copy(t);
}

function resetView() {
  controls.target.copy(CAM_DEFAULT.target);
  camera.position.copy(CAM_DEFAULT.pos);
  controls.update();
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (rtScene) {
    const rw = Math.max(2, Math.floor(w * 0.5));
    const rh = Math.max(2, Math.floor(h * 0.5));
    rtScene.setSize(rw, rh);
  }
}

function bindUI() {
  btnPause.addEventListener('click', () => {
    paused = !paused;
    btnPause.textContent = paused ? 'Resume' : 'Pause';
    btnPause.classList.toggle('paused', paused);
  });
  btnReset.addEventListener('click', resetView);
  window.addEventListener('resize', onResize);
}

let bubbleTimer = 0;
function updateBubbleSpawn(dt) {
  bubbleTimer -= dt;
  if (bubbleTimer <= 0) {
    bubbleTimer = 0.06 + rand() * 0.05;
    bubbleSys.spawn(NOZZLE.x, NOZZLE.y, NOZZLE.z);
  }
}

function updateWorld(dt) {
  updateBubbleSpawn(dt);
  bubbleSys.update(dt);
  waterSys.update();
  updateFish(dt);
  crab.update(dt);
  updateSnails(dt);
  particleSys.update(dt);
  for (const ps of plantSystems) ps.update();
}

function animate() {
  requestAnimationFrame(animate);
  const rawDt = clock.getDelta();
  const dt = paused ? 0 : Math.min(rawDt, 0.05);
  if (!paused) {
    simTime += dt;
    updateWorld(dt);
  }
  controls.update();
  if (envBgMat) envBgMat.uniforms.uTime.value = simTime;
  if (castleMat) {
    castleMat.uniforms.uTime.value = simTime;
    if (keyLight && keyLight.shadow.map) {
      castleMat.uniforms.uShadowMap.value = keyLight.shadow.map.texture;
      castleMat.uniforms.uShadowMatrix.value.copy(keyLight.shadow.matrix);
    }
  }
  if (causticMesh) causticMesh.material.uniforms.uTime.value = simTime;
  renderRefractionPass();
  renderer.render(scene, camera);
}

function init() {
  initRenderer();
  initScene();
  initCamera();
  initControls();
  defineGroundHeight();
  buildEnvironment();
  buildLights();
  buildTank();
  waterSys.build();
  initRefractionTargets();
  buildFilter();
  bubbleSys.build();
  defineCurrentField();
  buildPebbleBed();
  buildCastle();
  castleObstacles.push({ min: [FILTER_POS.x - 0.5, 0, FILTER_POS.z - 0.5], max: [FILTER_POS.x + 0.5, 1.9, FILTER_POS.z + 0.5] });
  buildVallisneria();
  buildAnubias();
  buildJavaFern();
  buildCabomba();
  spawnFishes();
  crab.build();
  buildSnails();
  buildCaustics();
  particleSys.build();
  bindUI();
  animate();
}

init();

</script>
